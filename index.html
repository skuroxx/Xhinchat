<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Peer-to-Peer Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f12; color: #e0e0e6; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 20px; 
        }
        .chat-container { 
            width: 100%; max-width: 500px; background: #16161a; 
            border: 1px solid #24242b; border-radius: 12px; padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        h2 { font-size: 1.4rem; margin-bottom: 15px; color: #fff; text-align: center;}
        .setup-box { background: #1f1f27; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d2d38; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #00adb5; font-weight: bold; }
        textarea { width: 100%; height: 60px; background: #0b0b0d; border: 1px solid #2d2d38; color: #fff; padding: 8px; border-radius: 6px; resize: none; font-size: 0.8rem; margin-bottom: 10px; }
        button { background: #00adb5; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; width: 100%; margin-bottom: 5px;}
        button:hover { background: #008f96; }
        .step-title { font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; color: #fff; }
        #chat-box { 
            width: 100%; height: 250px; border: 1px solid #24242b; overflow-y: auto; 
            padding: 15px; background: #0b0b0d; margin-bottom: 15px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message { padding: 8px 14px; border-radius: 8px; max-width: 75%; word-break: break-word; font-size: 0.95rem; }
        .sent { background: #00adb5; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: #24242b; color: #e0e0e6; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-group { display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 12px; background: #1f1f27; border: 1px solid #2d2d38; color: #fff; border-radius: 8px; outline: none; }
        #status { text-align: center; font-size: 0.85rem; margin-bottom: 10px; color: #ffbc00; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>P2P Serverless Chat</h2>
        <div id="status">Status: Waiting for Connection Setup...</div>

        <div class="setup-box" id="setup-panel">
            <div class="step-title">Step 1: Role Selection</div>
            <button onclick="startAsHost()">I want to Host the room</button>
            <button onclick="startAsJoiner()" style="background:#3e3e4f;">I have an invitation token</button>
            
            <div id="host-flow" style="display:none; margin-top:15px;">
                <label>Your Token (Copy this and send to your friend):</label>
                <textarea id="generated-token" readonly onclick="this.select()"></textarea>
                <label>Paste friend's response token here to link up:</label>
                <textarea id="friend-response-token" placeholder="Paste response token here..."></textarea>
                <button onclick="connectHost()">Complete Connection</button>
            </div>

            <div id="joiner-flow" style="display:none; margin-top:15px;">
                <label>Paste host's token here:</label>
                <textarea id="host-token-input" placeholder="Paste host token here..."></textarea>
                <button onclick="generateJoinerResponse()">Generate Response Token</button>
                <label style="margin-top:10px;">Your Response Token (Send this back to Host):</label>
                <textarea id="generated-response-token" readonly onclick="this.select()"></textarea>
            </div>
        </div>

        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="Type a message..." disabled>
            <button id="send-btn" onclick="sendMessage()" style="width:auto; margin:0;" disabled>Send</button>
        </div>
    </div>

    <script>
        let localConnection;
        let dataChannel;

        // Configuration utilizing standard public STUN servers to locate public IP routing paths
        const peerConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // --- HOST FLOW LOGIC ---
        async function startAsHost() {
            document.getElementById('host-flow').style.display = 'block';
            document.getElementById('joiner-flow').style.display = 'none';

            localConnection = new RTCPeerConnection(peerConfiguration);
            dataChannel = localConnection.createDataChannel("chatChannel");
            
            setupDataChannelEvents();

            localConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    // Once all network pathways are resolved, compile token
                    document.getElementById('generated-token').value = btoa(JSON.stringify(localConnection.localDescription));
                    document.getElementById('status').innerText = "Token Ready. Send it to your friend!";
                }
            };

            const offer = await localConnection.createOffer();
            await localConnection.setLocalDescription(offer);
        }

        async function connectHost() {
            const friendTokenRaw = document.getElementById('friend-response-token').value.trim();
            if(!friendTokenRaw) return alert("Please enter your friend's response token first!");
            
            const answerDesc = new RTCSessionDescription(JSON.parse(atob(friendTokenRaw)));
            await localConnection.setRemoteDescription(answerDesc);
        }


        // --- JOINER FLOW LOGIC ---
        function startAsJoiner() {
            document.getElementById('joiner-flow').style.display = 'block';
            document.getElementById('host-flow').style.display = 'none';
        }

        async function generateJoinerResponse() {
            const hostTokenRaw = document.getElementById('host-token-input').value.trim();
            if(!hostTokenRaw) return alert("Please paste the host's token first!");

            localConnection = new RTCPeerConnection(peerConfiguration);
            
            localConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupDataChannelEvents();
            };

            localConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    document.getElementById('generated-response-token').value = btoa(JSON.stringify(localConnection.localDescription));
                    document.getElementById('status').innerText = "Response Ready. Send it back to the Host!";
                }
            };

            const offerDesc = new RTCSessionDescription(JSON.parse(atob(hostTokenRaw)));
            await localConnection.setRemoteDescription(offerDesc);
            
            const answer = await localConnection.createAnswer();
            await localConnection.setLocalDescription(answer);
        }

        // --- CORE COMMUNICATION LOGIC ---
        function setupDataChannelEvents() {
            dataChannel.onopen = () => {
                document.getElementById('status').innerText = "Status: Connected! You can chat now.";
                document.getElementById('status').style.color = "#00ff87";
                document.getElementById('setup-panel').style.display = "none";
                document.getElementById('msg-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
            };

            dataChannel.onmessage = (e) => {
                displayMessage(e.data, 'received');
            };
            
            dataChannel.onclose = () => {
                document.getElementById('status').innerText = "Status: Disconnected.";
                document.getElementById('status').style.color = "#ff4a4a";
                document.getElementById('msg-input').disabled = true;
                document.getElementById('send-btn').disabled = true;
            };
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !dataChannel || dataChannel.readyState !== "open") return;

            displayMessage(text, 'sent');
            dataChannel.send(text);
            input.value = '';
        }

        function displayMessage(text, type) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
