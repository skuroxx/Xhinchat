<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhinchat // Secure P2P Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#0b0c10', panelBg: '#14161f', inputBg: '#1c1f2d' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex items-center justify-center p-3 sm:p-6 select-none font-sans">

    <script>
        function playPing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }
    </script>

    <div class="w-full max-w-xl bg-panelBg border border-gray-800 rounded-2xl shadow-2xl p-4 sm:p-6 flex flex-col gap-4 relative">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-800 pb-4">
            <div>
                <h2 class="text-xl font-extrabold text-white tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-user-group text-cyan-400" id="theme-icon"></i> Xhinchat
                </h2>
                <p class="text-xs text-amber-400 mt-1 font-medium flex items-center gap-1" id="status">
                    <i class="fa-solid fa-circle-dot animate-pulse text-[10px]"></i> <span>Awaiting connection...</span>
                </p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="resetTerminalState()" class="bg-gray-800/80 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Reset Terminal
                </button>
                <div class="flex flex-col">
                    <label class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1">Your Alias</label>
                    <input type="text" id="username-input" value="User_A" class="bg-inputBg border border-gray-700 text-sm rounded-lg px-2.5 py-1 text-white focus:outline-none focus:border-cyan-400 w-24 font-semibold">
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1">Theme</label>
                    <select id="theme-select" onchange="changeTheme()" class="bg-inputBg border border-gray-700 text-sm rounded-lg px-2 py-1 text-white focus:outline-none focus:border-cyan-400 cursor-pointer font-medium">
                        <option value="cyan">Cyber Cyan</option>
                        <option value="emerald">Emerald Moss</option>
                        <option value="purple">Neon Pulse</option>
                        <option value="rose">Velvet Rose</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-inputBg/30 border border-gray-800/80 p-4 rounded-xl flex flex-col gap-4 shadow-inner" id="setup-panel">
            <div class="flex flex-col sm:flex-row gap-3" id="selection-row">
                <button id="host-btn" onclick="startAsHost()" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-satellite-dish"></i> Host room
                </button>
                <button id="join-btn" onclick="startAsJoiner()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-2.5 px-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key"></i> Enter token
                </button>
            </div>
            
            <div id="host-flow" class="hidden flex flex-col gap-3">
                <div class="bg-darkBg p-3 rounded-lg border border-gray-800 relative">
                    <label class="text-xs font-bold text-cyan-400 block mb-1">1. Copy this room code & send to your friend:</label>
                    <textarea id="generated-token" readonly class="w-full h-16 bg-transparent text-xs font-mono text-gray-400 focus:outline-none resize-none pr-10 overflow-y-auto" onclick="this.select()"></textarea>
                    <button onclick="copyToken('generated-token')" class="absolute right-3 bottom-3 text-gray-400 hover:text-white transition"><i class="fa-regular fa-copy text-sm"></i></button>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 block mb-1">2. Paste friend's response token code below:</label>
                    <textarea id="friend-response-token" class="w-full h-16 bg-darkBg border border-gray-800 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-400 resize-none" placeholder="Paste response code text block here..."></textarea>
                </div>
                <button id="host-connect-btn" onclick="connectHost()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md">Establish P2P Connection</button>
            </div>

            <div id="joiner-flow" class="hidden flex flex-col gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-400 block mb-1">1. Paste the Host's room code here:</label>
                    <textarea id="host-token-input" class="w-full h-16 bg-darkBg border border-gray-800 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-400 resize-none" placeholder="Paste incoming host code..."></textarea>
                </div>
                <button id="joiner-generate-btn" onclick="generateJoinerResponse()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md">Compile Response Code</button>
                <div id="joiner-response-box" class="hidden bg-darkBg p-3 rounded-lg border border-gray-800 relative mt-2">
                    <label class="text-xs font-bold text-cyan-400 block mb-1">2. Send this response code back to the Host:</label>
                    <textarea id="generated-response-token" readonly class="w-full h-16 bg-transparent text-xs font-mono text-gray-400 focus:outline-none resize-none pr-10 overflow-y-auto" onclick="this.select()"></textarea>
                    <button onclick="copyToken('generated-response-token')" class="absolute right-3 bottom-3 text-gray-400 hover:text-white transition"><i class="fa-regular fa-copy text-sm"></i></button>
                </div>
            </div>
        </div>

        <div id="utility-bar" class="hidden flex items-center justify-end bg-inputBg/40 border border-gray-800 p-2.5 rounded-xl shadow-inner">
            <button onclick="exportEncryptedLog()" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-file-shield text-cyan-400"></i> Export Chat Log
            </button>
        </div>

        <div class="relative w-full">
            <div id="chat-box" onscroll="handleChatScroll()" class="w-full h-[340px] bg-darkBg border border-gray-800 rounded-xl overflow-y-auto p-4 flex flex-col gap-3 scroll-smooth">
                <div class="text-center text-xs text-gray-600 my-auto" id="placeholder-text">
                    <i class="fa-solid fa-link-slash text-4xl block mb-2 opacity-25"></i>
                    Disconnected. Exchange manual codes above to open chat.
                </div>
            </div>
            <button id="unread-badge" onclick="snapToBottom()" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 bg-cyan-500 text-white text-xs font-bold py-1.5 px-4 rounded-full shadow-xl flex items-center gap-2 z-10">
                <i class="fa-solid fa-arrow-down animate-bounce"></i> New message below
            </button>
        </div>
        
        <div class="flex gap-2 items-center w-full">
            <input type="file" id="file-uploader" class="hidden" onchange="processFileUpload()">
            <button onclick="triggerFileSelect()" id="clip-btn" disabled class="bg-inputBg hover:bg-gray-800 border border-gray-800 text-gray-400 disabled:opacity-30 p-3.5 rounded-xl transition flex items-center justify-center shrink-0">
                <i class="fa-solid fa-paperclip text-sm"></i>
            </button>

            <div class="flex-1 relative min-w-0 flex gap-2">
                <input type="text" id="msg-input" placeholder="Disconnected..." disabled class="w-full bg-inputBg border border-gray-800 text-sm text-white placeholder-gray-600 rounded-xl px-4 py-3.5 focus:outline-none focus:border-cyan-400 disabled:opacity-50 min-w-0">
                <button id="send-btn" onclick="sendMessage()" disabled class="bg-cyan-500 hover:bg-cyan-600 text-white disabled:opacity-50 font-bold p-3.5 rounded-xl flex items-center justify-center transition shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

        <div class="border-t border-gray-800 pt-4 mt-1 flex flex-col gap-2">
            <span class="text-[10px] uppercase font-bold tracking-wider text-gray-500"><i class="fa-solid fa-unlock-keyhole"></i> Quick File Decryption Log Viewer</span>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="file" id="decrypt-file-input" onchange="decryptUploadedLog()" class="bg-inputBg border border-gray-800 text-xs rounded-lg px-2.5 py-2 text-gray-400 w-full cursor-pointer">
            </div>
            <textarea id="decrypted-output" readonly class="w-full h-28 bg-darkBg border border-gray-800 rounded-lg p-3 text-xs font-mono text-emerald-400 focus:outline-none resize-none hidden" placeholder="Decoded logs output..."></textarea>
        </div>
    </div>

    <script>
        let localConnection = null, dataChannel = null;
        let currentThemeColor = 'cyan';
        let isUserScrolledUp = false;
        let internalLogMemory = [];
        let isTunnelOpen = false;
        
        const peerConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const FIXED_INTERNAL_KEY = "Xhinchat_Autokey_Signature_2026"; 

        const primaryColorMap = {
            cyan: { main: 'bg-cyan-500', hover: 'hover:bg-cyan-600', text: 'text-cyan-400', border: 'focus:border-cyan-400', msg: 'bg-cyan-600' },
            emerald: { main: 'bg-emerald-500', hover: 'hover:bg-emerald-600', text: 'text-emerald-400', border: 'focus:border-emerald-400', msg: 'bg-emerald-600' },
            purple: { main: 'bg-purple-500', hover: 'hover:bg-purple-600', text: 'text-purple-400', border: 'focus:border-purple-400', msg: 'bg-purple-600' },
            rose: { main: 'bg-rose-500', hover: 'hover:bg-rose-600', text: 'text-rose-400', border: 'focus:border-rose-400', msg: 'bg-rose-600' }
        };

        function changeTheme() {
            const select = document.getElementById('theme-select');
            const newTheme = select.value;
            const oldConf = primaryColorMap[currentThemeColor];
            const newConf = primaryColorMap[newTheme];

            document.querySelectorAll(`.${oldConf.main}`).forEach(el => {
                el.classList.replace(oldConf.main, newConf.main);
                if (el.classList.contains('hover:' + oldConf.main.split('-')[1])) el.classList.replace(oldConf.hover, newConf.hover);
            });
            document.getElementById('theme-icon').className = `fa-solid fa-user-group ${newConf.text}`;
            document.getElementById('msg-input').classList.replace(oldConf.border, newConf.border);
            document.getElementById('unread-badge').classList.replace(oldConf.main, newConf.main);
            document.querySelectorAll('.sent-bubble').forEach(b => b.classList.replace(oldConf.msg, newConf.msg));
            currentThemeColor = newTheme;
        }

        function formatMessageText(text) {
            let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/```([\s\S]+?)```/g, '<pre class="bg-black/40 text-gray-300 font-mono p-2 rounded-md my-1 text-xs border border-white/5 overflow-x-auto">$1</pre>');
            html = html.replace(/`([^`]+?)`/g, '<code class="bg-black/30 font-mono text-cyan-300 px-1 py-0.5 rounded text-xs">$1</code>');
            html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
            html = html.replace(/\*([^*]+?)\*/g, '<em class="italic">$1</em>');
            return html;
        }

        function handleChatScroll() {
            const box = document.getElementById('chat-box');
            isUserScrolledUp = (box.scrollHeight - box.scrollTop - box.clientHeight) > 40;
            if(!isUserScrolledUp) document.getElementById('unread-badge').classList.add('hidden');
        }

        function snapToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
            document.getElementById('unread-badge').classList.add('hidden');
        }

        function lockSetupButtons() {
            document.getElementById('host-btn').disabled = true;
            document.getElementById('join-btn').disabled = true;
        }

        // --- P2P CONNECTION SETUPS ---
        async function startAsHost() {
            lockSetupButtons();
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('host-flow').classList.remove('hidden');
            
            localConnection = new RTCPeerConnection(peerConfiguration);
            dataChannel = localConnection.createDataChannel("chatChannel");
            setupDataChannelEvents();
            setupConnectionMonitoring();

            localConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    // Compress text content block string tightly
                    document.getElementById('generated-token').value = btoa(JSON.stringify(localConnection.localDescription));
                    document.getElementById('status').innerHTML = `<i class="fa-solid fa-circle-dot animate-pulse mr-1 text-cyan-400"></i> Code ready. Copy step 1!`;
                }
            };
            await localConnection.setLocalDescription(await localConnection.createOffer());
        }

        async function connectHost() {
            const raw = document.getElementById('friend-response-token').value.trim();
            if(!raw) return alert("Please paste the response code first!");
            try { 
                document.getElementById('host-connect-btn').disabled = true;
                await localConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(raw)))); 
            } catch(e) { 
                alert("Invalid code pasted."); 
                document.getElementById('host-connect-btn').disabled = false;
            }
        }

        function startAsJoiner() {
            lockSetupButtons();
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('joiner-flow').classList.remove('hidden');
        }

        async function generateJoinerResponse() {
            const raw = document.getElementById('host-token-input').value.trim();
            if(!raw) return alert("Please paste the host's room code first!");
            try {
                document.getElementById('joiner-generate-btn').disabled = true;
                localConnection = new RTCPeerConnection(peerConfiguration);
                setupConnectionMonitoring();
                
                localConnection.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannelEvents(); };
                localConnection.onicecandidate = (e) => {
                    if (!e.candidate) {
                        document.getElementById('generated-response-token').value = btoa(JSON.stringify(localConnection.localDescription));
                        document.getElementById('joiner-response-box').classList.remove('hidden');
                        document.getElementById('status').innerHTML = `<i class="fa-solid fa-circle-dot animate-pulse mr-1 text-amber-400"></i> Response compiled! Copy step 2.`;
                    }
                };
                await localConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(raw))));
                await localConnection.setLocalDescription(await localConnection.createAnswer());
            } catch(e) { 
                alert("Corrupted code format."); 
                document.getElementById('joiner-generate-btn').disabled = false;
            }
        }

        function setupConnectionMonitoring() {
            localConnection.onconnectionstatechange = () => {
                if(localConnection.connectionState === "disconnected" || 
                   localConnection.connectionState === "failed" || 
                   localConnection.connectionState === "closed") {
                    handlePeerDisconnectEvent();
                }
            };
        }

        function handlePeerDisconnectEvent() {
            if(!isTunnelOpen) return;
            isTunnelOpen = false;
            
            document.getElementById('status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1"></i> User disconnected`;
            document.getElementById('status').className = "text-xs text-rose-500 font-bold mt-1";
            
            const box = document.getElementById('chat-box');
            const alertDiv = document.createElement('div');
            alertDiv.className = "w-full text-center my-2 text-xs font-bold text-rose-500 bg-rose-950/30 border border-rose-900/50 py-2 rounded-xl px-4";
            alertDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Connection broken: Peer disconnected.`;
            box.appendChild(alertDiv);
            snapToBottom();

            document.getElementById('msg-input').disabled = true;
            document.getElementById('msg-input').placeholder = "User disconnected...";
            document.getElementById('send-btn').disabled = true;
            document.getElementById('clip-btn').disabled = true;
        }

        // --- DATA TUNNEL HIGHWAY ROUTINES ---
        function setupDataChannelEvents() {
            dataChannel.onopen = () => {
                isTunnelOpen = true;
                const myAlias = document.getElementById('username-input').value.trim() || 'User_A';
                
                dataChannel.send(JSON.stringify({ type: 'handshake-identity', sender: myAlias }));

                document.getElementById('status').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Connected`;
                document.getElementById('status').className = "text-xs text-emerald-400 font-bold mt-1";
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('utility-bar').classList.remove('hidden');
                
                if(document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
                document.getElementById('msg-input').disabled = false;
                document.getElementById('msg-input').placeholder = "Write a message...";
                document.getElementById('send-btn').disabled = false;
                document.getElementById('clip-btn').disabled = false;
            };

            dataChannel.onmessage = (e) => {
                const p = JSON.parse(e.data);
                
                if(p.type === 'handshake-identity') {
                    document.getElementById('status').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> ${p.sender} is connected`;
                    return;
                }

                playPing();
                if(p.type === 'file') {
                    displayFileBubble(p.fileData, p.fileName, 'received', p.sender, p.time);
                    internalLogMemory.push(`[${p.time}] ${p.sender}: [Shared File: ${p.fileName}]`);
                } else {
                    displayMessage(p.text, 'received', p.sender, p.time);
                    internalLogMemory.push(`[${p.time}] ${p.sender}: ${p.text}`);
                }
                if(isUserScrolledUp) document.getElementById('unread-badge').classList.remove('hidden');
                else snapToBottom();
            };

            dataChannel.onclose = () => { handlePeerDisconnectEvent(); };
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if(!txt || !dataChannel || dataChannel.readyState !== "open") return;

            const name = document.getElementById('username-input').value.trim() || 'User_A';
            const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            dataChannel.send(JSON.stringify({ type: 'text', text: txt, sender: name, time: stamp }));
            displayMessage(txt, 'sent', name, stamp);
            internalLogMemory.push(`[${stamp}] ${name}: ${txt}`);
            input.value = '';
            snapToBottom();
        }

        function triggerFileSelect() { document.getElementById('file-uploader').click(); }

        function processFileUpload() {
            const f = document.getElementById('file-uploader').files[0];
            if (!f) return;
            if(f.size > 2 * 1024 * 1024) return alert("Maximum file size is 2MB!");

            const r = new FileReader();
            r.onload = function(ev) {
                const name = document.getElementById('username-input').value.trim() || 'User_A';
                const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                dataChannel.send(JSON.stringify({ type: 'file', fileData: ev.target.result, fileName: f.name, sender: name, time: stamp }));
                displayFileBubble(ev.target.result, f.name, 'sent', name, stamp);
                internalLogMemory.push(`[${stamp}] ${name}: [Shared File: ${f.name}]`);
                document.getElementById('file-uploader').value = '';
                snapToBottom();
            };
            r.readAsDataURL(f);
        }

        function resetTerminalState() {
            if(dataChannel) { dataChannel.close(); dataChannel = null; }
            if(localConnection) { localConnection.close(); localConnection = null; }

            isTunnelOpen = false;
            internalLogMemory = [];

            document.getElementById('status').innerHTML = `<i class="fa-solid fa-circle-dot animate-pulse mr-1 text-amber-400"></i> Awaiting connection...`;
            document.getElementById('status').className = "text-xs text-amber-400 font-medium mt-1";
            
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('selection-row').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            document.getElementById('joiner-response-box').classList.add('hidden');
            document.getElementById('utility-bar').classList.add('hidden');

            document.getElementById('host-btn').disabled = false;
            document.getElementById('join-btn').disabled = false;
            document.getElementById('host-connect-btn').disabled = false;
            document.getElementById('joiner-generate-btn').disabled = false;

            document.getElementById('generated-token').value = "";
            document.getElementById('friend-response-token').value = "";
            document.getElementById('host-token-input').value = "";
            document.getElementById('generated-response-token').value = "";

            const box = document.getElementById('chat-box');
            box.innerHTML = `
                <div class="text-center text-xs text-gray-600 my-auto" id="placeholder-text">
                    <i class="fa-solid fa-link-slash text-4xl block mb-2 opacity-25"></i>
                    Disconnected. Exchange manual codes above to open chat.
                </div>`;

            document.getElementById('msg-input').disabled = true;
            document.getElementById('msg-input').placeholder = "Disconnected...";
            document.getElementById('send-btn').disabled = true;
            document.getElementById('clip-btn').disabled = true;
        }

        // --- DRAW FUNCTIONS ---
        function displayMessage(text, type, user, time) {
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.className = `flex flex-col w-full max-w-[78%] gap-0.5 ${type === 'sent' ? 'self-end items-end' : 'self-start items-start'}`;
            const activeColor = primaryColorMap[currentThemeColor];
            const style = type === 'sent' ? `${activeColor.main} text-white rounded-2xl rounded-tr-none sent-bubble shadow-md` : `bg-gray-800/90 text-gray-200 rounded-2xl rounded-tl-none border border-gray-700/30`;

            div.innerHTML = `<span class="text-[10px] text-gray-500 font-bold tracking-wide">${user}</span><div class="px-4 py-2 text-sm break-all leading-relaxed ${style}">${formatMessageText(text)}</div><span class="text-[9px] text-gray-600 font-medium mt-0.5">${time}</span>`;
            box.appendChild(div);
        }

        function displayFileBubble(data, name, type, user, time) {
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.className = `flex flex-col w-full max-w-[75%] gap-0.5 ${type === 'sent' ? 'self-end items-end' : 'self-start items-start'}`;
            const activeColor = primaryColorMap[currentThemeColor];
            const style = type === 'sent' ? `${activeColor.main} text-white rounded-xl sent-bubble` : `bg-gray-800 text-gray-200 rounded-xl border border-gray-700/40`;

            let body = data.startsWith('data:image/') ? `<img src="${data}" class="max-w-full rounded-lg max-h-40 mb-2 border border-black/20 object-cover">` : '';
            body += `<a href="${data}" download="${name}" class="inline-flex items-center gap-1.5 bg-black/20 hover:bg-black/40 text-white font-bold text-[11px] px-2.5 py-1.5 rounded-lg border border-white/5 transition break-all shadow-sm"><i class="fa-solid fa-circle-down text-cyan-300"></i> Download File</a>`;

            div.innerHTML = `<span class="text-[10px] text-gray-500 font-bold tracking-wide">${user}</span><div class="p-2.5 shadow-sm ${style}">${body}</div><span class="text-[9px] text-gray-600 font-medium">${time}</span>`;
            box.appendChild(div);
        }

        // --- TRANSCRIPT HANDLING ---
        function exportEncryptedLog() {
            if(internalLogMemory.length === 0) return alert("No history logged yet!");
            const encryptedString = CryptoJS.AES.encrypt(internalLogMemory.join('\n'), FIXED_INTERNAL_KEY).toString();
            const element = document.createElement('a');
            element.href = URL.createObjectURL(new Blob([encryptedString], {type: 'text/plain'}));
            element.download = `xhinchat_history_${new Date().toISOString().slice(0,10)}.enc`;
            document.body.appendChild(element); element.click(); document.body.removeChild(element);
        }

        function decryptUploadedLog() {
            const fileInput = document.getElementById('decrypt-file-input').files[0];
            const outputBox = document.getElementById('decrypted-output');
            if (!fileInput) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const cipherText = e.target.result;
                    const bytes = CryptoJS.AES.decrypt(cipherText, FIXED_INTERNAL_KEY);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);

                    if (!originalText) throw new Error();

                    outputBox.value = originalText;
                    outputBox.classList.remove('hidden');
                } catch (err) {
                    alert("This file is corrupted or not a valid Xhinchat log backup!");
                    outputBox.classList.add('hidden');
                }
            };
            reader.readAsText(fileInput);
        }

        function copyToken(id) { 
            const textarea = document.getElementById(id);
            textarea.select();
            navigator.clipboard.writeText(textarea.value); 
            alert("Code text copied to clipboard!"); 
        }
        document.getElementById('msg-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
