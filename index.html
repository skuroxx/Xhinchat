<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Incognito Chatroom</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f12; 
            color: #e0e0e6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .chat-container { 
            width: 100%; 
            max-width: 450px; 
            background: #16161a; 
            border: 1px solid #24242b; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        h2 { font-size: 1.4rem; margin-bottom: 15px; color: #fff; }
        #room-share { 
            background: #1f1f27; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            border: 1px solid #2d2d38; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #room-url { color: #00adb5; word-break: break-all; margin-right: 10px; }
        .copy-btn {
            background: #2d2d38; color: #fff; border: none; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 0.75rem;
        }
        .copy-btn:hover { background: #3e3e4f; }
        #chat-box { 
            width: 100%; height: 320px; border: 1px solid #24242b; overflow-y: auto; 
            padding: 15px; background: #0b0b0d; margin-bottom: 15px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message { padding: 8px 14px; border-radius: 8px; max-width: 75%; word-break: break-word; font-size: 0.95rem; line-height: 1.4; }
        .sent { background: #00adb5; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: #24242b; color: #e0e0e6; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-group { display: flex; gap: 10px; }
        #msg-input { 
            flex: 1; padding: 12px; background: #1f1f27; border: 1px solid #2d2d38; 
            color: #fff; border-radius: 8px; outline: none; font-size: 0.95rem;
        }
        #msg-input:focus { border-color: #00adb5; }
        #send-btn { 
            background: #00adb5; color: #fff; border: none; padding: 0 20px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem;
        }
        #send-btn:hover { background: #008f96; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Incognito Room</h2>
        <div id="room-share">
            <span id="room-url">Loading link...</span>
            <button class="copy-btn" onclick="copyRoomLink()">Copy</button>
        </div>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // REPLACE THIS URL WITH YOUR ACTUAL PELLA APP DOMAIN URL
        const BACKEND_URL = 'https://588b907d4f1e42b89.pella.app'; 
        
        const socket = io(BACKEND_URL, {
            transports: ['websocket', 'polling']
        }); 
        
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');

        const urlParams = new URLSearchParams(window.location.search);
        let roomID = urlParams.get('room');

        if (!roomID) {
            roomID = Math.random().toString(36).substring(2, 8);
            urlParams.set('room', roomID);
            window.history.pushState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }

        document.getElementById('room-url').innerText = window.location.href;

        // Connect to room channel on server
        socket.emit('join-room', roomID);

        // Retrieve local history
        window.onload = () => {
            const savedChat = JSON.parse(sessionStorage.getItem(`chatHistory_${roomID}`)) || [];
            savedChat.forEach(msg => displayMessage(msg.text, msg.type));
        };

        // Listen for messages
        socket.on('receive-message', (messageText) => {
            displayMessage(messageText, 'received');
            saveMessageToStorage(messageText, 'received');
        });

        function sendMessage() {
            const messageText = msgInput.value.trim();
            if (!messageText) return;

            displayMessage(messageText, 'sent');
            saveMessageToStorage(messageText, 'sent');

            socket.emit('send-message', { room: roomID, message: messageText });
            msgInput.value = '';
        }

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function displayMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveMessageToStorage(text, type) {
            const storageKey = `chatHistory_${roomID}`;
            const currentChat = JSON.parse(sessionStorage.getItem(storageKey)) || [];
            currentChat.push({ text, type });
            sessionStorage.setItem(storageKey, JSON.stringify(currentChat));
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Room invitation link copied!");
        }
    </script>
</body>
</html>
