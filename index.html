<body class="bg-darkBg text-gray-200 min-h-screen w-screen flex items-center justify-center sm:p-4 select-none font-sans antialiased overflow-hidden">

    <script>
        let audioContextInstance = null;
        function getAudioContext() {
            if (!audioContextInstance) {
                audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContextInstance.state === 'suspended') {
                audioContextInstance.resume();
            }
            return audioContextInstance;
        }

        function playIncomingSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(620, ctx.currentTime);
                osc.frequency.setValueAtTime(930, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.4, ctx.currentTime); // Highly amplified loud gain
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        function playOutgoingSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(520, ctx.currentTime);
                osc.frequency.setValueAtTime(780, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.4, ctx.currentTime); // Highly amplified loud gain
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            } catch(e) {}
        }
    </script>

    <div class="w-full h-full sm:h-auto sm:max-w-xl bg-panelBg sm:border sm:border-gray-800/60 sm:rounded-3xl shadow-2xl flex flex-col p-4 sm:p-6 gap-4 relative justify-between">
        
        <div class="flex items-center justify-between gap-3 border-b border-gray-800/80 pb-3 shrink-0">

            <div class="flex items-center gap-2">
                <button onclick="resetTerminalState()" class="bg-gray-800/40 hover:bg-rose-950/30 border border-gray-700/50 hover:border-rose-900/40 text-gray-300 hover:text-rose-400 font-bold px-2.5 py-1.5 rounded-xl text-[11px] transition-all duration-150 flex items-center gap-1">

        <div class="bg-inputBg/30 border border-gray-800/70 p-4 rounded-2xl flex flex-col gap-3 shadow-inner shrink-0" id="setup-panel">

                    <textarea id="host-token-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full h-12 bg-darkBg border border-gray-800 rounded-xl p-2 text-[11px] font-mono text-white placeholder-gray-700 focus:outline-none focus:border-cyan-400 resize-none" placeholder="Paste host room token here..."></textarea>

                    <button onclick="copyToken('generated-response-token')" class="absolute right-2 bottom-2 bg-gray-800 hover:bg-gray-700 text-gray-300 p-1 rounded-lg border border-gray-700 transition"><i class="fa-regular fa-copy text-[11px]"></i></button>

            <div class="flex-1 min-w-0 flex gap-2">

                <button id="send-btn" onclick="sendMessage()" disabled class="bg-cyan-500 hover:bg-cyan-600 text-white disabled:opacity-30 font-bold p-3 rounded-xl flex items-center justify-center transition shrink-0 shadow-md">

            <input type="file" id="decrypt-file-input" onchange="decryptUploadedLog()" class="bg-inputBg/40 border border-gray-800 text-[10px] rounded-xl px-2.5 py-1.5 text-gray-400 w-full cursor-pointer file:bg-gray-800 file:text-gray-300 file:border-0 file:rounded file:text-[10px] file:font-bold file:px-2 file:mr-2">
            <textarea id="decrypted-output" readonly class="w-full h-16 bg-darkBg border border-gray-800 rounded-xl p-2 text-xs font-mono text-emerald-400 focus:outline-none resize-none hidden shadow-inner"></textarea>
        </div>

    <script>
        let localConnection = null, dataChannel = null;
        let currentThemeColor = 'cyan';
        let isUserScrolledUp = false;
        let internalLogMemory = [];
        let isTunnelOpen = false;
        let remotePeerAlias = 'Peer';
        let typingTimeoutReference = null;
        
        const peerConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const FIXED_INTERNAL_KEY = "Xhinchat_Autokey_Signature_2026"; 

        const primaryColorMap = {
            cyan: { main: 'from-cyan-500 to-blue-600', hover: 'hover:from-cyan-600 hover:to-blue-700', text: 'text-cyan-400', border: 'focus:border-cyan-400', msg: 'bg-cyan-600 text-white rounded-tr-none' },
            emerald: { main: 'from-emerald-500 to-teal-600', hover: 'hover:from-emerald-600 hover:to-teal-700', text: 'text-emerald-400', border: 'focus:border-emerald-400', msg: 'bg-emerald-600 text-white rounded-tr-none' },
            purple: { main: 'from-purple-500 to-indigo-600', hover: 'hover:from-purple-600 hover:to-indigo-700', text: 'text-purple-400', border: 'focus:border-purple-400', msg: 'bg-purple-600 text-white rounded-tr-none' },
            rose: { main: 'from-rose-500 to-pink-600', hover: 'hover:from-rose-600 hover:to-pink-700', text: 'text-rose-400', border: 'focus:border-rose-400', msg: 'bg-rose-600 text-white rounded-tr-none' }
        };

        // --- BROWSER PERSISTENT REHYDRATION STATE ENGINES ---
        window.onload = function() {
            if(localStorage.getItem('xhin_alias')) document.getElementById('username-input').value = localStorage.getItem('xhin_alias');
            if(localStorage.getItem('xhin_theme')) document.getElementById('theme-select').value = localStorage.getItem('xhin_theme');
            changeTheme();

            // Load saved conversation history logs dynamically on page boots
            if(localStorage.getItem('xhin_persist_logs')) {
                internalLogMemory = JSON.parse(localStorage.getItem('xhin_persist_logs'));
                if(internalLogMemory.length > 0) {
                    if(document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
                    internalLogMemory.forEach(logItem => {
                        const parsed = parseHistoryString(logItem);
                        if(parsed) renderDOMBubble(parsed.text, parsed.type, parsed.user, parsed.time, parsed.isFile, parsed.fileData, parsed.fileName, parsed.msgId, true);
                    });
                    snapToBottom();
                }
            }

            // BACKGROUND RECOVERY ENGINE: Check if an active signaling description block state exists
            if(localStorage.getItem('xhin_rtc_local_desc') && localStorage.getItem('xhin_rtc_remote_desc')) {
                attemptBackgroundTunnelRecovery();
            }
        };

        function saveIdentityState() {
            localStorage.setItem('xhin_alias', document.getElementById('username-input').value.trim() || 'User_A');
        }

        function commitLogsToStorage(logString) {
            internalLogMemory.push(logString);
            localStorage.setItem('xhin_persist_logs', JSON.stringify(internalLogMemory));
        }

        function parseHistoryString(str) {
            // Evaluates structure logs configurations matching parameters smoothly
            const match = str.match(/^\[(.*?)\] \((.*?)\) (.*?): (.*)$/);
            if(!match) return null;
            const time = match[1];
            const msgId = match[2];
            const user = match[3];
            const content = match[4];
            
            const currentAlias = document.getElementById('username-input').value.trim() || 'User_A';
            const type = (user === currentAlias) ? 'sent' : 'received';

            if(content.startsWith('[FILE:')) {
                const fileMatch = content.match(/^\[FILE: (.*?) \| (.*?)\]$/);
                if(fileMatch) return { time, msgId, user, type, isFile: true, fileData: fileMatch[1], fileName: fileMatch[2] };
            }
            return { time, msgId, user, type, isFile: false, text: content };
        }

        // --- BACKGROUND AUTOMATED SESSION PERSISTENCE TUNNELLING ---
        async function attemptBackgroundTunnelRecovery() {
            try {
                document.getElementById('status').innerText = "Recovering session sync...";
                lockSetupButtons();
                document.getElementById('selection-row').classList.add('hidden');

                localConnection = new RTCPeerConnection(peerConfiguration);
                setupConnectionMonitoring();

                localConnection.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannelEvents(); };
                
                // Host setup recovery mode checks 
                if(localStorage.getItem('xhin_rtc_role') === 'host') {
                    dataChannel = localConnection.createDataChannel("chatChannel");
                    setupDataChannelEvents();
                }

                const localDesc = JSON.parse(atob(localStorage.getItem('xhin_rtc_local_desc')));
                const remoteDesc = JSON.parse(atob(localStorage.getItem('xhin_rtc_remote_desc')));

                await localConnection.setRemoteDescription(new RTCSessionDescription(remoteDesc));
                if(localStorage.getItem('xhin_rtc_role') === 'joiner') {
                    await localConnection.setLocalDescription(new RTCSessionDescription(localDesc));
                } else {
                    // For host recovery sequences
                    await localConnection.setLocalDescription(new RTCSessionDescription(localDesc));
                }
            } catch(e) { resetTerminalState(); }
        }

        function changeTheme() {
            const select = document.getElementById('theme-select');
            const newTheme = select.value;
            localStorage.setItem('xhin_theme', newTheme);
            const oldConf = primaryColorMap[currentThemeColor];
            const newConf = primaryColorMap[newTheme];

            document.querySelectorAll('.bg-gradient-to-r').forEach(el => {
                if(el.classList.contains(oldConf.main)) {
                    el.classList.remove(...oldConf.main.split(' ')); el.classList.add(...newConf.main.split(' '));
                }
            });
            document.getElementById('brand-text').className = `bg-gradient-to-r ${newConf.main} bg-clip-text text-transparent text-xl font-black tracking-tight`;
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${isTunnelOpen ? 'bg-emerald-500' : 'bg-amber-500 animate-pulse'}`;
            document.getElementById('msg-input').className = `w-full bg-inputBg border border-gray-800 text-sm text-white placeholder-gray-600 rounded-xl px-3.5 py-3 focus:outline-none ${newConf.border} disabled:opacity-45 min-w-0 shadow-inner`;
            document.getElementById('unread-badge').classList.replace('bg-cyan-500', 'bg-' + newTheme + '-500');
            document.querySelectorAll('.sent-bubble-node').forEach(b => b.className = `px-3.5 py-2 text-xs break-all leading-relaxed shadow-sm sent-bubble-node ${newConf.msg}`);
            currentThemeColor = newTheme;
        }

        function formatMessageText(text) {
            let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/```([\s\S]+?)```/g, '<pre class="bg-black/40 font-mono p-2 rounded-xl my-1 text-[11px] border border-white/5 overflow-x-auto text-gray-300">$1</pre>');
            html = html.replace(/`([^`]+?)`/g, '<code class="bg-black/30 font-mono text-cyan-300 px-1 py-0.5 rounded text-[11px]">$1</code>');
            html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
            html = html.replace(/\*([^*]+?)\*/g, '<em class="italic">$1</em>');
            return html;
        }

        function handleChatScroll() {
            const box = document.getElementById('chat-box');
            isUserScrolledUp = (box.scrollHeight - box.scrollTop - box.clientHeight) > 40;
            if(!isUserScrolledUp) document.getElementById('unread-badge').classList.add('hidden');
            
            // RUN MESSAGE SEEN HUD SIGNALS: If user is reading received notifications 
            if(!isUserScrolledUp && isTunnelOpen) {
                document.querySelectorAll('.unread-receipt-marker').forEach(node => {
                    const msgId = node.getAttribute('data-msg-id');
                    if(msgId) {
                        dataChannel.send(JSON.stringify({ type: 'seen-receipt', id: msgId }));
                        node.classList.remove('unread-receipt-marker');
                    }
                });
            }
        }

        function snapToBottom() {
            const box = document.getElementById('chat-box'); box.scrollTop = box.scrollHeight;
            document.getElementById('unread-badge').classList.add('hidden');
            handleChatScroll();
        }

        function lockSetupButtons() {
            document.getElementById('host-btn').disabled = true; document.getElementById('join-btn').disabled = true;
        }

        // --- P2P KEY EXCHANGE SCHEDULER SYSTEMS ---
        async function startAsHost() {
            lockSetupButtons(); localStorage.setItem('xhin_rtc_role', 'host');
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('host-flow').classList.remove('hidden');
            
            localConnection = new RTCPeerConnection(peerConfiguration);
            dataChannel = localConnection.createDataChannel("chatChannel");
            setupDataChannelEvents(); setupConnectionMonitoring();

            localConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    const offer = btoa(JSON.stringify(localConnection.localDescription));
                    document.getElementById('generated-token').value = offer;
                    localStorage.setItem('xhin_rtc_local_desc', offer);
                    document.getElementById('status').innerHTML = `Code compile complete. Send step 1!`;
                }
            };
            await localConnection.setLocalDescription(await localConnection.createOffer());
        }

        async function connectHost() {
            let raw = document.getElementById('friend-response-token').value.trim();
            raw = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\s/g, '');
            if(!raw) return alert("Please supply response block first!");
            try { 
                document.getElementById('host-connect-btn').disabled = true;
                localStorage.setItem('xhin_rtc_remote_desc', raw);
                await localConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(raw)))); 
            } catch(e) { alert("Invalid signature code."); document.getElementById('host-connect-btn').disabled = false; }
        }

        function startAsJoiner() {
            lockSetupButtons(); localStorage.setItem('xhin_rtc_role', 'joiner');
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('joiner-flow').classList.remove('hidden');
        }

        async function generateJoinerResponse() {
            let raw = document.getElementById('host-token-input').value.trim();
            raw = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\s/g, '');
            if(!raw) return alert("Please paste the host code segment!");
            try {
                document.getElementById('joiner-generate-btn').disabled = true;
                localStorage.setItem('xhin_rtc_remote_desc', raw);

                localConnection = new RTCPeerConnection(peerConfiguration);
                setupConnectionMonitoring();
                localConnection.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannelEvents(); };
                
                localConnection.onicecandidate = (e) => {
                    if (!e.candidate) {
                        const answer = btoa(JSON.stringify(localConnection.localDescription));
                        document.getElementById('generated-response-token').value = answer;
                        localStorage.setItem('xhin_rtc_local_desc', answer);
                        document.getElementById('status').innerHTML = `Response compilation ready. Copy step 2!`;
                    }
                };
                await localConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(raw))));
                await localConnection.setLocalDescription(await localConnection.createAnswer());
            } catch(e) { alert("Corrupted code arrays passed."); document.getElementById('joiner-generate-btn').disabled = false; }
        }

        function setupConnectionMonitoring() {
            localConnection.onconnectionstatechange = () => {
                if(localConnection.connectionState === "disconnected" || localConnection.connectionState === "failed" || localConnection.connectionState === "closed") {
                    handlePeerDisconnectEvent();
                }
            };
        }

        function handlePeerDisconnectEvent() {
            if(!isTunnelOpen) return; isTunnelOpen = false;
            
            document.getElementById('status').innerText = "User disconnected";
            document.getElementById('status').className = "text-xs text-rose-500 font-bold mt-0.5";
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-rose-500";
            
            const box = document.getElementById('chat-box');
            const alertDiv = document.createElement('div');
            alertDiv.className = "w-full text-center my-1 text-[11px] font-bold text-rose-400 bg-rose-950/20 border border-rose-900/30 py-2 rounded-xl px-4";
            alertDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> Connection dropped: ${remotePeerAlias} left the session.`;
            box.appendChild(alertDiv); snapToBottom();

            document.getElementById('msg-input').disabled = true;
            document.getElementById('msg-input').placeholder = "User disconnected...";
            document.getElementById('send-btn').disabled = true;
            document.getElementById('clip-btn').disabled = true;
        }

        // --- CHANNEL TRAFFIC & EVENT LOGICS ---
        function setupDataChannelEvents() {
            dataChannel.onopen = () => {
                isTunnelOpen = true;
                const myAlias = document.getElementById('username-input').value.trim() || 'User_A';
                dataChannel.send(JSON.stringify({ type: 'handshake-identity', sender: myAlias }));

                document.getElementById('status').innerText = "Connected";
                document.getElementById('status').className = "text-xs text-emerald-400 font-bold mt-0.5";
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
                
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('utility-bar').classList.remove('hidden');
                
                if(document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
                document.getElementById('msg-input').disabled = false;
                document.getElementById('msg-input').placeholder = "Write a message...";
                document.getElementById('send-btn').disabled = false;
                document.getElementById('clip-btn').disabled = false;
            };

            dataChannel.onmessage = (e) => {
                const p = JSON.parse(e.data);
                
                // Handle Handshake Identifiers
                if(p.type === 'handshake-identity') {
                    remotePeerAlias = p.sender;
                    document.getElementById('status').innerText = `${p.sender} is connected`;
                    document.getElementById('typing-hud-text').innerText = `${p.sender} is typing`;
                    return;
                }

                // Handle Typing HUD alerts signals
                if(p.type === 'typing-signal') {
                    const hud = document.getElementById('typing-hud');
                    if(p.isTyping) hud.classList.replace('hidden', 'flex');
                    else hud.classList.replace('flex', 'hidden');
                    return;
                }

                // Handle Seen Receipts Indicators confirmations
                if(p.type === 'seen-receipt') {
                    const tickNode = document.getElementById(`tick-${p.id}`);
                    if(tickNode) {
                        tickNode.innerHTML = `<i class="fa-solid fa-check-double text-emerald-400"></i> Seen`;
                        tickNode.className = "text-[9px] text-emerald-400 font-bold tracking-tight mt-0.5 transition-colors";
                    }
                    return;
                }

                // Normal Input Messages Parser
                playIncomingSound();
                if(p.type === 'file') {
                    displayFileBubble(p.fileData, p.fileName, 'received', p.sender, p.time, p.id);
                    commitLogsToStorage(`[${p.time}] (${p.id}) ${p.sender}: [FILE: ${p.fileData} | ${p.fileName}]`);
                } else {
                    displayMessage(p.text, 'received', p.sender, p.time, p.id);
                    commitLogsToStorage(`[${p.time}] (${p.id}) ${p.sender}: ${p.text}`);
                }
                
                // Fire Seen message confirmations if recipient reads text instantly
                if(!isUserScrolledUp) {
                    dataChannel.send(JSON.stringify({ type: 'seen-receipt', id: p.id }));
                } else {
                    const bubble = document.getElementById(`msg-wrapper-${p.id}`);
                    if(bubble) bubble.classList.add('unread-receipt-marker');
                }
                if(isUserScrolledUp) document.getElementById('unread-badge').classList.remove('hidden');
                else snapToBottom();
            };

            dataChannel.onclose = () => { handlePeerDisconnectEvent(); };
        }

        // --- DATA DISPATCH CHANNELS ---
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if(!txt || !dataChannel || dataChannel.readyState !== "open") return;

            const name = document.getElementById('username-input').value.trim() || 'User_A';
            const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgId = "msg-" + Date.now() + Math.random().toString(36).substring(2, 5);

            playOutgoingSound(); // Crisp amplified outbox sound chime triggered
            dataChannel.send(JSON.stringify({ type: 'text', text: txt, sender: name, time: stamp, id: msgId }));
            displayMessage(txt, 'sent', name, stamp, msgId);
            commitLogsToStorage(`[${stamp}] (${msgId}) ${name}: ${txt}`);
            
            // Instantly broadcast negative typing state on fire text execution
            dataChannel.send(JSON.stringify({ type: 'typing-signal', isTyping: false }));
            input.value = ''; snapToBottom();
        }

        function broadcastTypingSignal() {
            if(!dataChannel || dataChannel.readyState !== "open") return;
            dataChannel.send(JSON.stringify({ type: 'typing-signal', isTyping: true }));
            
            clearTimeout(typingTimeoutReference);
            typingTimeoutReference = setTimeout(() => {
                dataChannel.send(JSON.stringify({ type: 'typing-signal', isTyping: false }));
            }, 1500);
        }

        function triggerFileSelect() { document.getElementById('file-uploader').click(); }

        function processFileUpload() {
            const f = document.getElementById('file-uploader').files[0];
            if (!f) return; if(f.size > 2 * 1024 * 1024) return alert("Maximum file size is 2MB!");

            const r = new FileReader();
            r.onload = function(ev) {
                const name = document.getElementById('username-input').value.trim() || 'User_A';
                const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const msgId = "msg-" + Date.now() + Math.random().toString(36).substring(2, 5);
                
                playOutgoingSound();
                dataChannel.send(JSON.stringify({ type: 'file', fileData: ev.target.result, fileName: f.name, sender: name, time: stamp, id: msgId }));
                displayFileBubble(ev.target.result, f.name, 'sent', name, stamp, msgId);
                commitLogsToStorage(`[${stamp}] (${msgId}) ${name}: [FILE: ${ev.target.result} | ${f.name}]`);
                document.getElementById('file-uploader').value = ''; snapToBottom();
            };
            r.readAsDataURL(f);
        }

        function resetTerminalState() {
            // Explicitly purge background rehydration cache arrays strings completely
            localStorage.removeItem('xhin_persist_logs');
            localStorage.removeItem('xhin_rtc_local_desc');
            localStorage.removeItem('xhin_rtc_remote_desc');
            localStorage.removeItem('xhin_rtc_role');

            if(dataChannel) { dataChannel.close(); dataChannel = null; }
            if(localConnection) { localConnection.close(); localConnection = null; }

            isTunnelOpen = false; internalLogMemory = [];
            document.getElementById('status').innerText = "Awaiting connection...";
            document.getElementById('status').className = "text-xs text-amber-400 font-medium mt-0.5";
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            document.getElementById('typing-hud').classList.replace('flex', 'hidden');
            
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('selection-row').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            document.getElementById('joiner-response-box').classList.add('hidden');
            document.getElementById('utility-bar').classList.add('hidden');

            document.getElementById('host-btn').disabled = false; document.getElementById('join-btn').disabled = false;
            document.getElementById('host-connect-btn').disabled = false; document.getElementById('joiner-generate-btn').disabled = false;

            document.getElementById('generated-token').value = ""; document.getElementById('friend-response-token').value = "";
            document.getElementById('host-token-input').value = ""; document.getElementById('generated-response-token').value = "";

            document.getElementById('chat-box').innerHTML = `
                <div class="text-center text-xs text-gray-600 my-auto p-6" id="placeholder-text">
                    <i class="fa-solid fa-shield-halved text-3xl block mb-2 opacity-20"></i>
                    Disconnected. Exchange validation tokens above to link chat terminal.
                </div>`;

            document.getElementById('msg-input').disabled = true; document.getElementById('msg-input').placeholder = "Locks engaged...";
            document.getElementById('send-btn').disabled = true; document.getElementById('clip-btn').disabled = true;
        }

        // --- UI BUBBLE PRESENTATION GENERATORS ---
        function displayMessage(text, type, user, time, id) {
            renderDOMBubble(text, type, user, time, false, null, null, id, false);
        }

        function displayFileBubble(data, name, type, user, time, id) {
            renderDOMBubble(null, type, user, time, true, data, name, id, false);
        }

        function renderDOMBubble(text, type, user, time, isFile = false, fileData = null, fileName = null, id = null, isRehydrated = false) {
            if(document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
            
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.id = `msg-wrapper-${id}`;
            div.setAttribute('data-msg-id', id);
            div.className = `flex flex-col w-full max-w-[85%] gap-0.5 ${type === 'sent' ? 'self-end items-end' : 'self-start items-start'}`;
            
            const activeColor = primaryColorMap[currentThemeColor];
            let bubbleStyle = (type === 'sent') ? `sent-bubble-node ${activeColor.msg}` : `bg-bubblePeer text-gray-100 rounded-2xl rounded-tl-none border border-gray-800/40`;

            let bubbleContent = "";
            if(isFile) {
                let preview = fileData.startsWith('data:image/') ? `<img src="${fileData}" class="max-w-full rounded-xl max-h-36 mb-1.5 object-cover shadow-sm">` : '';
                bubbleContent = `<div class="p-2 rounded-2xl shadow-md ${bubbleStyle}">${preview}<a href="${fileData}" download="${fileName}" class="inline-flex items-center gap-1 bg-black/20 hover:bg-black/40 text-white font-extrabold text-[10px] px-2.5 py-1.5 rounded-lg border border-white/5 transition break-all shadow-sm"><i class="fa-solid fa-circle-down text-cyan-400"></i> Download</a></div>`;
            } else {
                bubbleContent = `<div class="px-3.5 py-2 text-xs break-all leading-relaxed shadow-md rounded-2xl ${bubbleStyle}">${formatMessageText(text)}</div>`;
            }

            // Draw Check receipt tick lines for outbound bubbles dynamically
            let receiptLine = "";
            if(type === 'sent') {
                receiptLine = isRehydrated 
                    ? `<span class="text-[9px] text-gray-600 font-semibold" id="tick-${id}"><i class="fa-solid fa-check-double"></i> Archived</span>`
                    : `<span class="text-[9px] text-gray-600 font-semibold" id="tick-${id}"><i class="fa-solid fa-check text-gray-500"></i> Delivered</span>`;
            }

            div.innerHTML = `<span class="text-[10px] text-gray-500 font-extrabold px-1 tracking-wide">${user}</span>${bubbleContent}<div class="flex items-center gap-1.5 px-1 mt-0.5">${receiptLine}<span class="text-[9px] text-gray-600 font-medium tracking-tight">${time}</span></div>`;
            box.appendChild(div);
        }

        // --- ENCRYPTED DECRYPTION SANDBOX ---
        function exportEncryptedLog() {
            if(internalLogMemory.length === 0) return alert("No logs recorded!");
            const encryptedString = CryptoJS.AES.encrypt(internalLogMemory.join('\n'), FIXED_INTERNAL_KEY).toString();
            const element = document.createElement('a');
            element.href = URL.createObjectURL(new Blob([encryptedString], {type: 'text/plain'}));
            element.download = `xhinchat_history_${new Date().toISOString().slice(0,10)}.enc`;
            document.body.appendChild(element); element.click(); document.body.removeChild(element);
        }

        function decryptUploadedLog() {
            const fileInput = document.getElementById('decrypt-file-input').files[0];
            const outputBox = document.getElementById('decrypted-output'); if (!fileInput) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const originalText = CryptoJS.AES.decrypt(e.target.result, FIXED_INTERNAL_KEY).toString(CryptoJS.enc.Utf8);
                    if (!originalText) throw new Error();
                    outputBox.value = originalText.replace(/\(msg-.*?\)/g, '').replace(/\[FILE:.*?\|(.*?)\]/g, '[Shared File: $1]');
                    outputBox.classList.remove('hidden');
                } catch (err) { alert("Invalid log backup data file!"); outputBox.classList.add('hidden'); }
            };
            reader.readAsText(fileInput);
        }

        function copyToken(id) { 
            const textarea = document.getElementById(id); textarea.focus(); textarea.setSelectionRange(0, 99999);
            try {
                navigator.clipboard.writeText(textarea.value).then(() => alert("Token copied!")).catch(() => {
                    document.execCommand('copy'); alert("Token copied!");
                });
            } catch (err) { document.execCommand('copy'); alert("Token copied!"); }
        }
        document.getElementById('msg-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
