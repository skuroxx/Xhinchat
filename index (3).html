<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#050609', panelBg: '#0b0d14', inputBg: '#111420', bubblePeer: '#161a29' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }

        }

    <style>
        #chat-box::-webkit-scrollbar, .thin-scroll::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-track, .thin-scroll::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb, .thin-scroll::-webkit-scrollbar-thumb { background: #1f253d; border-radius: 99px; }
        @keyframes dotBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .bounce-dot { animation: dotBounce 1.2s infinite ease-in-out; }
        .bounce-dot:nth-child(2) { animation-delay: 0.2s; }
        .bounce-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fadeSlideIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
        .msg-enter { animation: fadeSlideIn .22s ease-out; }
        @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.5);} 100% { box-shadow: 0 0 0 8px rgba(16,185,129,0);} }
        .pulse-ring { animation: pulseRing 1.6s infinite; }
        .drag-active { outline: 2px dashed rgba(34,211,238,.6); outline-offset: -4px; background: rgba(34,211,238,.05); }
        .progress-track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }

</head>
<body class="bg-darkBg text-gray-200 min-h-screen w-screen flex flex-col items-center justify-start sm:justify-center p-0 sm:p-4 select-none font-sans antialiased overflow-y-auto">

    <script>
        let audioContextInstance = null;
        function getAudioContext() {
            if (!audioContextInstance) audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContextInstance.state === 'suspended') audioContextInstance.resume();
            return audioContextInstance;
        }
        function playIncomingSound() {
            try { const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(620, ctx.currentTime);
            osc.frequency.setValueAtTime(930, ctx.currentTime + 0.06); gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.25); } catch(e) {}
        }
        function playOutgoingSound() {
            try { const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(520, ctx.currentTime);
            osc.frequency.setValueAtTime(780, ctx.currentTime + 0.04); gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.2); } catch(e) {}
        }
        function playJoinSound() {
            try { const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(660, ctx.currentTime + 0.08); osc.frequency.setValueAtTime(880, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35); } catch(e) {}
        }
    </script>

    <!-- QR Modal: reused for both displaying a token as a scannable code and scanning one via camera -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-panelBg border border-gray-800 rounded-2xl p-4 w-full max-w-xs flex flex-col gap-3 items-center shadow-2xl">
            <div class="flex items-center justify-between w-full">
                <span id="qr-modal-title" class="text-xs font-extrabold text-white flex items-center gap-1.5"><i class="fa-solid fa-qrcode text-cyan-400"></i> QR Connect</span>
                <button onclick="closeQrModal()" class="text-gray-500 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="qr-display-wrap" class="hidden bg-white p-3 rounded-xl">
                <div id="qr-canvas-target"></div>
            </div>
            <div id="qr-scan-wrap" class="hidden w-full flex flex-col items-center gap-2">
                <div class="relative w-full rounded-xl overflow-hidden bg-black">
                    <video id="qr-video" class="w-full aspect-square object-cover" playsinline muted autoplay></video>
                    <div class="absolute inset-6 border-2 border-cyan-400/70 rounded-xl pointer-events-none"></div>
                </div>
                <canvas id="qr-scan-canvas" class="hidden"></canvas>
            </div>
            <p class="text-[9px] text-gray-500 text-center leading-snug" id="qr-modal-hint"></p>
        </div>
    </div>

    <div class="w-full max-w-xl bg-panelBg sm:border sm:border-gray-800/40 sm:rounded-3xl shadow-2xl flex flex-col p-4 sm:p-6 gap-3.5 relative overflow-hidden shrink-0">

        <!-- Header -->
        <div class="flex items-center justify-between gap-3 border-b border-gray-800/50 pb-3 shrink-0">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    <span class="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent shadow-sm" id="brand-text">Xhinchat</span>
                    <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]" id="status-dot"></span>
                </h1>
                <p class="text-[11px] text-gray-400 font-bold tracking-wide mt-0.5" id="status">Awaiting setup...</p>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="confirmFullReset()" class="bg-gray-800/40 hover:bg-rose-950/30 border border-gray-700/50 hover:border-rose-900/40 text-gray-300 hover:text-rose-400 font-bold px-2.5 py-1.5 rounded-xl text-[11px] transition-all flex items-center gap-1 shadow-md">
                    <i class="fa-solid fa-power-off text-[10px]"></i> Reset
                </button>
                <input type="text" id="username-input" value="User_A" maxlength="16" oninput="saveIdentityState()" class="bg-inputBg border border-gray-800 text-[11px] font-bold rounded-xl px-2 py-1.5 text-white focus:outline-none focus:border-cyan-500 w-20 text-center shadow-inner">
                <select id="theme-select" onchange="changeTheme()" class="bg-inputBg border border-gray-800 text-[11px] font-bold rounded-xl px-2 py-1.5 text-white focus:outline-none cursor-pointer shadow-inner">
                    <option value="cyan">Cyan</option>
                    <option value="emerald">Emerald</option>
                    <option value="purple">Purple</option>
                    <option value="rose">Rose</option>
                </select>
            </div>
        </div>

        <!-- Peer strip (visible once at least one peer has ever connected) -->
        <div id="peer-strip" class="hidden flex items-center gap-1.5 overflow-x-auto thin-scroll pb-1 -mb-1 shrink-0"></div>

        <!-- Connection Panel -->
        <div class="bg-inputBg/30 border border-gray-800/60 p-4 rounded-2xl flex flex-col gap-3 shadow-inner shrink-0" id="setup-panel">
            <div class="flex gap-3" id="selection-row">
                <button id="host-btn" onclick="uiStartHostFlow()" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg transition-all text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-satellite-dish"></i> Host Room
                </button>
                <button id="join-btn" onclick="uiStartJoinerFlow()" class="flex-1 bg-gray-800/60 hover:bg-gray-700 border border-gray-700/80 text-white font-extrabold py-3 px-4 rounded-xl transition-all text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-link"></i> Enter Token
                </button>
            </div>

            <div id="host-flow" class="hidden flex flex-col gap-3">
                <div class="bg-darkBg/50 p-3 rounded-xl border border-gray-800 relative shadow-inner">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-extrabold text-cyan-400 uppercase tracking-wider">1. Copy this room code & send to your friend:</label>
                        <span class="text-[9px] text-gray-600 font-mono" id="host-token-size"></span>
                    </div>
                    <textarea id="generated-token" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full h-16 bg-transparent text-xs font-mono text-gray-500 focus:outline-none resize-none pr-16 overflow-y-auto" placeholder="Compiling network tokens... Please wait..." onclick="this.select()"></textarea>
                    <div class="absolute right-2 bottom-2 flex gap-1.5">
                        <button onclick="showTokenQr('generated-token')" title="Show as QR code" class="bg-inputBg border border-gray-800 text-gray-300 p-1.5 rounded-lg transition hover:text-cyan-400"><i class="fa-solid fa-qrcode text-xs"></i></button>
                        <button onclick="copyToken('generated-token')" title="Copy text token" class="bg-inputBg border border-gray-800 text-gray-300 p-1.5 rounded-lg transition hover:text-white"><i class="fa-regular fa-copy text-xs"></i></button>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider">2. Paste friend's response token code below:</label>
                        <button onclick="openQrScanner('friend-response-token', uiConnectHost)" class="text-[9px] font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-1 shrink-0"><i class="fa-solid fa-camera"></i> Scan QR</button>
                    </div>
                    <textarea id="friend-response-token" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full h-16 bg-darkBg border border-gray-800 rounded-xl p-2.5 text-xs font-mono text-white placeholder-gray-700 focus:outline-none focus:border-cyan-400 resize-none shadow-inner" placeholder="Paste response token here, or scan their QR..."></textarea>
                </div>
                <div class="flex gap-2">
                    <button id="host-connect-btn" onclick="uiConnectHost()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">Establish Connection</button>
                    <button onclick="cancelPendingFlow()" class="bg-gray-800/60 hover:bg-gray-700 border border-gray-700/60 text-gray-300 font-bold py-2.5 px-3.5 rounded-xl text-xs transition">Cancel</button>
                </div>
            </div>

            <div id="joiner-flow" class="hidden flex flex-col gap-3">
                <div class="bg-darkBg/50 p-3 rounded-xl border border-gray-800 shadow-inner">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider">1. Paste the Host's room code here:</label>
                        <button onclick="openQrScanner('host-token-input', uiGenerateJoinerResponse)" class="text-[9px] font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-1 shrink-0"><i class="fa-solid fa-camera"></i> Scan QR</button>
                    </div>
                    <textarea id="host-token-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full h-16 bg-transparent border border-gray-800 rounded-xl p-2.5 text-xs font-mono text-white placeholder-gray-700 focus:outline-none focus:border-cyan-400 resize-none" placeholder="Paste host room token here, or scan their QR..."></textarea>
                </div>
                <div class="flex gap-2">
                    <button id="joiner-generate-btn" onclick="uiGenerateJoinerResponse()" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">Compile Response Code</button>
                    <button onclick="cancelPendingFlow()" class="bg-gray-800/60 hover:bg-gray-700 border border-gray-700/60 text-gray-300 font-bold py-2.5 px-3.5 rounded-xl text-xs transition">Cancel</button>
                </div>

                <div id="joiner-response-box" class="hidden bg-darkBg/70 p-3 rounded-xl border border-gray-800 relative mt-1 shadow-inner">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-extrabold text-cyan-400 uppercase tracking-wider">2. Send this response code back to the Host:</label>
                        <span class="text-[9px] text-gray-600 font-mono" id="join-token-size"></span>
                    </div>
                    <textarea id="generated-response-token" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full h-16 bg-transparent text-xs font-mono text-gray-500 focus:outline-none resize-none pr-16 overflow-y-auto" placeholder="Compiling response... Please wait..." onclick="this.select()"></textarea>
                    <div class="absolute right-2 bottom-2 flex gap-1.5">
                        <button onclick="showTokenQr('generated-response-token')" title="Show as QR code" class="bg-inputBg border border-gray-800 text-gray-300 p-1.5 rounded-lg transition hover:text-cyan-400"><i class="fa-solid fa-qrcode text-xs"></i></button>
                        <button onclick="copyToken('generated-response-token')" title="Copy text token" class="bg-inputBg border border-gray-800 text-gray-300 p-1.5 rounded-lg transition hover:text-white"><i class="fa-regular fa-copy text-xs"></i></button>
                    </div>
                </div>
            </div>
            <p class="text-[9px] text-gray-600 leading-snug" id="setup-hint">Same room, tap "Show QR" and let them scan it. Different cities, copy the text token and send it however you like — both connect the same way underneath.</p>
        </div>

        <!-- Utility Toolbar -->
        <div id="utility-bar" class="hidden flex items-center justify-between border-b border-gray-800 pb-2 shrink-0 gap-2">
            <div class="flex items-center gap-1.5">
                <button onclick="uiStartHostFlow()" class="bg-gray-800/40 hover:bg-gray-800 border border-gray-700/60 text-gray-300 hover:text-cyan-300 text-[10px] font-bold py-1 px-2.5 rounded-lg flex items-center gap-1 transition shadow-sm">
                    <i class="fa-solid fa-user-plus text-cyan-400"></i> Invite Peer
                </button>
                <button onclick="uiStartJoinerFlow()" class="bg-gray-800/40 hover:bg-gray-800 border border-gray-700/60 text-gray-300 hover:text-cyan-300 text-[10px] font-bold py-1 px-2.5 rounded-lg flex items-center gap-1 transition shadow-sm">
                    <i class="fa-solid fa-door-open text-cyan-400"></i> Join Another
                </button>
            </div>
            <button onclick="exportEncryptedLog()" class="bg-gray-800/40 hover:bg-gray-800 border border-gray-700/60 text-gray-400 hover:text-gray-200 text-[10px] font-bold py-1 px-2.5 rounded-lg flex items-center gap-1 transition shadow-sm">
                <i class="fa-solid fa-file-shield text-cyan-400"></i> Export Logs
            </button>
        </div>

        <!-- Chat View -->
        <div class="relative w-full h-[calc(100vh-220px)] sm:h-[420px] shrink-0">
            <div id="chat-box" onscroll="handleChatScroll()" ondragover="event.preventDefault(); document.getElementById('chat-box').classList.add('drag-active')" ondragleave="document.getElementById('chat-box').classList.remove('drag-active')" ondrop="handleFileDrop(event)" class="w-full h-full bg-darkBg border border-gray-900 rounded-2xl overflow-y-auto p-4 flex flex-col gap-3.5 shadow-inner transition-all">
                <div class="text-center text-xs text-gray-600 my-auto p-6" id="placeholder-text">
                    <i class="fa-solid fa-shield-halved text-4xl block mb-2 opacity-20"></i>
                    Disconnected. Exchange manual codes above to open chat.
                </div>
            </div>
            <button id="unread-badge" onclick="snapToBottom()" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 bg-cyan-500 text-white text-[11px] font-extrabold py-1.5 px-3 rounded-full shadow-lg flex items-center gap-1.5 z-10">
                <i class="fa-solid fa-arrow-down animate-bounce"></i> New text below
            </button>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-hud" class="w-full pl-2 text-[10px] text-gray-500 font-extrabold items-center gap-1.5 h-4 hidden shrink-0 tracking-wide">
            <span id="typing-hud-text">Peer is typing</span>
            <div class="flex gap-0.5 items-center">
                <span class="w-1 h-1 bg-gray-500 rounded-full bounce-dot"></span>
                <span class="w-1 h-1 bg-gray-500 rounded-full bounce-dot"></span>
                <span class="w-1 h-1 bg-gray-500 rounded-full bounce-dot"></span>
            </div>
        </div>

        <!-- Action Inputs Area -->
        <div class="flex gap-2.5 items-center w-full shrink-0">
            <input type="file" id="file-uploader" class="hidden" onchange="handleFileInputChange()">
            <button onclick="triggerFileSelect()" id="clip-btn" disabled class="bg-inputBg border border-gray-800 text-gray-400 disabled:opacity-20 p-3.5 rounded-xl transition flex items-center justify-center shrink-0 shadow-md">
                <i class="fa-solid fa-paperclip text-sm"></i>
            </button>

            <div class="flex-1 min-w-0 flex gap-2">
                <input type="text" id="msg-input" oninput="broadcastTypingSignal()" placeholder="Locks engaged..." disabled class="w-full bg-inputBg border border-gray-800 text-sm text-white placeholder-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-400 disabled:opacity-40 min-w-0 shadow-inner">
                <button id="send-btn" onclick="sendMessage()" disabled class="bg-cyan-500 hover:bg-cyan-600 text-white disabled:opacity-30 font-bold p-3 rounded-xl flex items-center justify-center transition shrink-0 shadow-md">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Log Sandbox -->
        <div class="border-t border-gray-900 pt-3 flex flex-col gap-1.5 shrink-0">
            <span class="text-[9px] uppercase font-black tracking-wider text-gray-500 flex items-center gap-1"><i class="fa-solid fa-unlock-keyhole text-gray-600"></i> Local Crypt Decryption Viewer</span>
            <input type="file" id="get-file-log" onchange="decryptUploadedLog()" class="bg-inputBg/40 border border-gray-800 text-[10px] rounded-xl px-2.5 py-1.5 text-gray-400 w-full file:bg-gray-800 file:text-gray-300 file:border-0 file:rounded file:text-[10px] file:px-2 file:mr-2">
            <textarea id="decrypted-output" readonly class="w-full h-16 bg-darkBg border border-gray-800 rounded-xl p-2 text-xs font-mono text-emerald-400 focus:outline-none resize-none hidden shadow-inner"></textarea>
        </div>
    </div>

    <script>
        // ================= STATE =================
        const peers = new Map(); // peerId -> { pc, dc, alias, status, missedPings, lastActivityAt, heartbeatTimer, role }
        let peerCounter = 0;
        let pendingPeerId = null; // the peer slot currently being negotiated via the setup panel

        let currentThemeColor = 'cyan';
        let isUserScrolledUp = false;
        let internalLogMemory = [];
        let typingHudSet = new Set(); // aliases currently typing, across all peers

        const fileReceiveBuffers = new Map(); // fileId -> { fileName, fileType, totalChunks, parts, sender, time, id, receivedCount }
        const CHUNK_SIZE = 16 * 1024; // safe SCTP message size
        const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB soft cap for a smooth P2P transfer
        const MAX_PERSISTED_FILE_CHARS = 700 * 1024; // avoid blowing localStorage quota on huge files

        const peerConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
        const FIXED_INTERNAL_KEY = "Xhinchat_Autokey_Signature_2026";

        const primaryColorMap = {
            cyan: { main: 'from-cyan-500 to-blue-600', hover: 'hover:from-cyan-600 hover:to-blue-700', text: 'text-cyan-400', border: 'focus:border-cyan-400', msg: 'bg-cyan-600 text-white rounded-tr-none' },
            emerald: { main: 'from-emerald-500 to-teal-600', hover: 'hover:from-emerald-600 hover:to-teal-700', text: 'text-emerald-400', border: 'focus:border-emerald-400', msg: 'bg-emerald-600 text-white rounded-tr-none' },
            purple: { main: 'from-purple-500 to-indigo-600', hover: 'hover:from-purple-600 hover:to-indigo-700', text: 'text-purple-400', border: 'focus:border-purple-400', msg: 'bg-purple-600 text-white rounded-tr-none' },
            rose: { main: 'from-rose-500 to-pink-600', hover: 'hover:from-rose-600 hover:to-pink-700', text: 'text-rose-400', border: 'focus:border-rose-400', msg: 'bg-rose-600 text-white rounded-tr-none' }
        };
        // Static literal palette so Tailwind's CDN scanner can detect & generate these classes.
        const avatarPalette = [
            { bg: 'bg-pink-500/90', text: 'text-pink-300' }, { bg: 'bg-amber-500/90', text: 'text-amber-300' },
            { bg: 'bg-lime-500/90', text: 'text-lime-300' }, { bg: 'bg-sky-500/90', text: 'text-sky-300' },
            { bg: 'bg-violet-500/90', text: 'text-violet-300' }, { bg: 'bg-orange-500/90', text: 'text-orange-300' },
            { bg: 'bg-fuchsia-500/90', text: 'text-fuchsia-300' }, { bg: 'bg-teal-500/90', text: 'text-teal-300' }
        ];

        // ================= INIT =================
        window.onload = function() {
            if(localStorage.getItem('xhin_alias')) document.getElementById('username-input').value = localStorage.getItem('xhin_alias');
            if(localStorage.getItem('xhin_theme')) document.getElementById('theme-select').value = localStorage.getItem('xhin_theme');
            changeTheme();

            if(localStorage.getItem('xhin_persist_logs')) {
                try { internalLogMemory = JSON.parse(localStorage.getItem('xhin_persist_logs')); } catch(e) { internalLogMemory = []; }
                if(internalLogMemory.length > 0) {
                    if(document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
                    internalLogMemory.forEach(logItem => {
                        const parsed = parseHistoryString(logItem);
                        if(parsed) renderDOMBubble(parsed.text, parsed.type, parsed.user, parsed.time, parsed.isFile, parsed.fileData, parsed.fileName, parsed.msgId, true, parsed.isSystem);
                    });
                    snapToBottom();
                }
            }
            document.getElementById('msg-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        };

        function myAlias() { return document.getElementById('username-input').value.trim() || 'User_A'; }
        function genId() { return "msg-" + Date.now().toString(36) + Math.random().toString(36).substring(2, 6); }
        function timeStamp() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

        function saveIdentityState() { localStorage.setItem('xhin_alias', myAlias()); }

        // ================= TOAST (replaces blocking alert()) =================
        function toast(msg, isError = false) {
            const el = document.createElement('div');
            el.className = `fixed left-1/2 -translate-x-1/2 bottom-6 z-50 px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl border max-w-[90%] text-center ${isError ? 'bg-rose-950/95 border-rose-800 text-rose-300' : 'bg-gray-900/95 border-gray-700 text-gray-200'}`;
            el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translate(-50%,10px)';
            el.textContent = msg;
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translate(-50%,0)'; });
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2600);
        }

        // ================= TOKEN ENCODE/DECODE (compressed, shorter than raw base64) =================
        function encodeToken(descriptionObj) {
            const json = JSON.stringify(descriptionObj);
            return LZString.compressToEncodedURIComponent(json);
        }
        function decodeToken(raw) {
            const cleaned = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\s/g, '');
            let json = LZString.decompressFromEncodedURIComponent(cleaned);
            if (!json) { // fall back in case someone pastes an old-format base64(JSON) token
                try { json = atob(cleaned); JSON.parse(json); } catch (e) { json = null; }
            }
            if (!json) throw new Error("Could not decode token");
            return JSON.parse(json);
        }

        // ================= THEME =================
        function changeTheme() {
            const select = document.getElementById('theme-select');
            const newTheme = select.value;
            localStorage.setItem('xhin_theme', newTheme);
            const oldConf = primaryColorMap[currentThemeColor];
            const newConf = primaryColorMap[newTheme];

            document.querySelectorAll('.bg-gradient-to-r').forEach(el => {
                if(el.classList.contains(oldConf.main.split(' ')[0])) {
                    el.classList.remove(...oldConf.main.split(' ')); el.classList.add(...newConf.main.split(' '));
                }
            });
            document.getElementById('brand-text').className = `bg-gradient-to-r ${newConf.main} bg-clip-text text-transparent text-2xl font-black tracking-tight`;
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full shadow-[0_0_8px_currentColor] ${connectedPeerCount() > 0 ? 'text-emerald-400 bg-emerald-400' : 'text-amber-400 bg-amber-400 animate-pulse'}`;
            document.getElementById('msg-input').className = `w-full bg-inputBg border border-gray-800 text-sm text-white placeholder-gray-600 rounded-xl px-4 py-3 focus:outline-none ${newConf.border} disabled:opacity-40 min-w-0 shadow-inner transition-all`;
            document.getElementById('unread-badge').className = `hidden absolute bottom-4 left-1/2 -translate-x-1/2 bg-${newTheme}-500 text-white text-[11px] font-extrabold py-1.5 px-3 rounded-full shadow-lg flex items-center gap-1.5 z-10`;
            document.querySelectorAll('.sent-bubble-node').forEach(b => b.className = `px-3.5 py-2 text-xs break-all leading-relaxed shadow-md rounded-2xl sent-bubble-node ${newConf.msg}`);
            currentThemeColor = newTheme;
        }

        function formatMessageText(text) {
            let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/```([\s\S]+?)```/g, '<pre class="bg-black/40 font-mono p-2 rounded-xl my-1 text-[11px] border border-white/5 overflow-x-auto text-gray-300">$1</pre>');
            html = html.replace(/`([^`]+?)`/g, '<code class="bg-black/30 font-mono text-cyan-300 px-1 py-0.5 rounded text-[11px]">$1</code>');
            html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
            html = html.replace(/\*([^*]+?)\*/g, '<em class="italic">$1</em>');
            html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" class="underline decoration-dotted hover:text-cyan-300 break-all">$1</a>');
            return html;
        }

        function handleChatScroll() {
            const box = document.getElementById('chat-box');
            isUserScrolledUp = (box.scrollHeight - box.scrollTop - box.clientHeight) > 40;
            if(!isUserScrolledUp) document.getElementById('unread-badge').classList.add('hidden');

            if(!isUserScrolledUp) {
                document.querySelectorAll('.unread-receipt-marker').forEach(node => {
                    const msgId = node.getAttribute('data-msg-id');
                    const originPeerId = node.getAttribute('data-origin-peer');
                    if(msgId && originPeerId) {
                        const peer = peers.get(originPeerId);
                        if(peer && peer.dc && peer.dc.readyState === 'open') safeSend(peer.dc, { type: 'seen-receipt', id: msgId });
                        node.classList.remove('unread-receipt-marker');
                    }
                });
            }
        }

        function snapToBottom() {
            const box = document.getElementById('chat-box'); box.scrollTop = box.scrollHeight;
            document.getElementById('unread-badge').classList.add('hidden');
            handleChatScroll();
        }

        // ================= AVATAR =================
        function hashPalette(name) {
            let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
            return avatarPalette[h % avatarPalette.length];
        }
        function initialsOf(name) { return (name || '?').trim().slice(0, 2).toUpperCase(); }

        // ================= PEER STRIP UI =================
        function refreshPeerStrip() {
            const strip = document.getElementById('peer-strip');
            const openPeers = [...peers.entries()].filter(([id, p]) => p.status !== 'closed');
            if (openPeers.length === 0) { strip.classList.add('hidden'); strip.innerHTML = ''; return; }
            strip.classList.remove('hidden');
            strip.innerHTML = openPeers.map(([id, p]) => {
                const pal = hashPalette(p.alias || 'Peer');
                const statusColor = p.status === 'open' ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse';
                return `<div class="peer-chip shrink-0 flex items-center gap-1.5 bg-inputBg border border-gray-800 rounded-full pl-1 pr-2 py-1">
                    <span class="w-6 h-6 rounded-full ${pal.bg} flex items-center justify-center text-[9px] font-black text-white relative">
                        ${initialsOf(p.alias)}
                        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full ${statusColor} border border-panelBg"></span>
                    </span>
                    <span class="text-[10px] font-bold text-gray-300 max-w-[70px] truncate">${p.alias || 'Connecting…'}</span>
                    <button onclick="disconnectPeer('${id}')" title="Disconnect ${p.alias || 'peer'}" class="text-gray-600 hover:text-rose-400 transition"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                </div>`;
            }).join('');
        }

        function connectedPeerCount() { return [...peers.values()].filter(p => p.status === 'open').length; }

        function updateGlobalStatusUI() {
            const count = connectedPeerCount();
            const statusEl = document.getElementById('status');
            const dotEl = document.getElementById('status-dot');
            if (count === 0) {
                statusEl.innerText = "Awaiting connection...";
                statusEl.className = "text-[11px] text-amber-400 font-bold tracking-wide mt-0.5";
                dotEl.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse shadow-[0_0_8px_#fbbf24]";
                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('utility-bar').classList.add('hidden');
                document.getElementById('msg-input').disabled = true;
                document.getElementById('msg-input').placeholder = "Locks engaged...";
                document.getElementById('send-btn').disabled = true;
                document.getElementById('clip-btn').disabled = true;
            } else {
                const names = [...peers.values()].filter(p => p.status === 'open').map(p => p.alias).join(', ');
                statusEl.innerText = count === 1 ? `Connected with ${names}` : `Connected · ${count} peers (${names})`;
                statusEl.className = "text-[11px] text-emerald-400 font-bold tracking-wide mt-0.5";
                dotEl.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] pulse-ring";
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('utility-bar').classList.remove('hidden');
                document.getElementById('msg-input').disabled = false;
                document.getElementById('msg-input').placeholder = "Write a message...";
                document.getElementById('send-btn').disabled = false;
                document.getElementById('clip-btn').disabled = false;
            }
            refreshPeerStrip();
        }

        // ================= SETUP PANEL FLOW CONTROL =================
        function uiStartHostFlow() {
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('host-flow').classList.remove('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            document.getElementById('generated-token').value = '';
            document.getElementById('friend-response-token').value = '';
            document.getElementById('host-token-size').innerText = '';
            beginHostOffer();
        }

        function uiStartJoinerFlow() {
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('selection-row').classList.add('hidden');
            document.getElementById('joiner-flow').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('host-token-input').value = '';
            document.getElementById('generated-response-token').value = '';
            document.getElementById('joiner-response-box').classList.add('hidden');
            document.getElementById('joiner-generate-btn').disabled = false;
        }

        function cancelPendingFlow() {
            if (pendingPeerId && peers.has(pendingPeerId) && peers.get(pendingPeerId).status !== 'open') {
                const p = peers.get(pendingPeerId);
                try { if (p.pc) p.pc.close(); } catch(e) {}
                peers.delete(pendingPeerId);
            }
            pendingPeerId = null;
            document.getElementById('selection-row').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            if (connectedPeerCount() === 0) {
                document.getElementById('setup-panel').classList.remove('hidden');
            } else {
                document.getElementById('setup-panel').classList.add('hidden');
            }
        }

        // ================= PEER CONNECTION LIFECYCLE =================
        function createPeerRecord(role) {
            const id = 'peer-' + (++peerCounter);
            const pc = new RTCPeerConnection(peerConfiguration);
            peers.set(id, { pc, dc: null, alias: 'Peer', status: 'connecting', missedPings: 0, lastActivityAt: Date.now(), heartbeatTimer: null, role });
            return id;
        }

        async function beginHostOffer() {
            const id = createPeerRecord('host');
            pendingPeerId = id;
            const peer = peers.get(id);

            const dc = peer.pc.createDataChannel('chatChannel');
            attachDataChannel(id, dc);

            peer.pc.onicecandidate = (e) => {
                if (!e.candidate) {
                    const token = encodeToken(peer.pc.localDescription);
                    document.getElementById('generated-token').value = token;
                    document.getElementById('host-token-size').innerText = `${token.length} chars`;
                    document.getElementById('status').innerHTML = `Code compiled. Copy step 1!`;
                }
            };
            peer.pc.onconnectionstatechange = () => watchPcConnectionState(id);
            await peer.pc.setLocalDescription(await peer.pc.createOffer());
        }

        async function uiConnectHost() {
            const raw = document.getElementById('friend-response-token').value.trim();
            if (!raw) return toast("Please paste the response token code first!", true);
            const id = pendingPeerId;
            const peer = id ? peers.get(id) : null;
            if (!peer) return toast("Session expired, please restart the host flow.", true);
            try {
                document.getElementById('host-connect-btn').disabled = true;
                const desc = decodeToken(raw);
                await peer.pc.setRemoteDescription(new RTCSessionDescription(desc));
            } catch (e) {
                toast("Invalid or corrupted response code.", true);
                document.getElementById('host-connect-btn').disabled = false;
            }
        }

        async function uiGenerateJoinerResponse() {
            const raw = document.getElementById('host-token-input').value.trim();
            if (!raw) return toast("Please paste the host's room code first!", true);
            try {
                document.getElementById('joiner-generate-btn').disabled = true;
                const desc = decodeToken(raw);

                const id = createPeerRecord('joiner');
                pendingPeerId = id;
                const peer = peers.get(id);
                peer.pc.ondatachannel = (e) => attachDataChannel(id, e.channel);
                peer.pc.onconnectionstatechange = () => watchPcConnectionState(id);

                peer.pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        const answer = encodeToken(peer.pc.localDescription);
                        document.getElementById('generated-response-token').value = answer;
                        document.getElementById('join-token-size').innerText = `${answer.length} chars`;
                        document.getElementById('joiner-response-box').classList.remove('hidden');
                        document.getElementById('status').innerHTML = `Response code built. Copy step 2!`;
                    }
                };
                await peer.pc.setRemoteDescription(new RTCSessionDescription(desc));
                await peer.pc.setLocalDescription(await peer.pc.createAnswer());
            } catch (e) {
                toast("Corrupted or invalid room code.", true);
                document.getElementById('joiner-generate-btn').disabled = false;
            }
        }

        function watchPcConnectionState(peerId) {
            const peer = peers.get(peerId);
            if (!peer) return;
            const state = peer.pc.connectionState;
            if (state === 'failed' || (state === 'disconnected' && peer.status === 'open')) {
                // Give transient network blips a moment before declaring the peer gone.
                setTimeout(() => {
                    const p = peers.get(peerId);
                    if (p && (p.pc.connectionState === 'failed' || p.pc.connectionState === 'disconnected')) {
                        onPeerClosed(peerId);
                    }
                }, 6000);
            }
        }

        function attachDataChannel(peerId, dc) {
            const peer = peers.get(peerId);
            if (!peer) return;
            peer.dc = dc;
            dc.bufferedAmountLowThreshold = 256 * 1024;
            dc.onopen = () => onPeerOpen(peerId);
            dc.onmessage = (e) => onPeerMessage(peerId, e);
            dc.onclose = () => onPeerClosed(peerId);
            dc.onerror = () => onPeerClosed(peerId);
        }

        function onPeerOpen(peerId) {
            const peer = peers.get(peerId);
            if (!peer) return;
            peer.status = 'open';
            peer.lastActivityAt = Date.now();
            pendingPeerId = null;

            safeSend(peer.dc, { type: 'handshake-identity', sender: myAlias() });

            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('selection-row').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            if (document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();

            startHeartbeatForPeer(peerId);
            updateGlobalStatusUI();
            playJoinSound();
        }

        function onPeerClosed(peerId) {
            const peer = peers.get(peerId);
            if (!peer || peer.status === 'closed') return;
            const wasOpen = peer.status === 'open';
            peer.status = 'closed';
            clearInterval(peer.heartbeatTimer);
            try { if (peer.dc) peer.dc.close(); } catch(e) {}
            try { if (peer.pc) peer.pc.close(); } catch(e) {}
            peers.delete(peerId);

            if (wasOpen) {
                const noticeText = `${peer.alias || 'A peer'} disconnected.`;
                const id = genId(); const time = timeStamp();
                renderSystemNotice(noticeText);
                commitLogsToStorage(`[${time}] (${id}) [SYS]: ${noticeText}`);
                relayToOthers(null, JSON.stringify({ type: 'system', text: noticeText, id, time }));
            }
            updateGlobalStatusUI();
        }

        function disconnectPeer(peerId) {
            const peer = peers.get(peerId);
            if (!peer) return;
            onPeerClosed(peerId);
        }

        // ================= HEARTBEAT (lenient — avoids false disconnects during file transfer) =================
        function startHeartbeatForPeer(peerId) {
            const peer = peers.get(peerId);
            if (!peer) return;
            clearInterval(peer.heartbeatTimer);
            peer.missedPings = 0;
            peer.heartbeatTimer = setInterval(() => {
                const p = peers.get(peerId);
                if (!p || !p.dc || p.dc.readyState !== 'open') return;
                // Any recent traffic (including in-flight file chunks) counts as proof of life —
                // this is what stops big transfers from tripping a false disconnect.
                if (Date.now() - p.lastActivityAt < 5000) { p.missedPings = 0; return; }
                p.missedPings++;
                if (p.missedPings >= 6) { onPeerClosed(peerId); return; }
                safeSend(p.dc, { type: 'internal-ping' });
            }, 4000);
        }

        // ================= MESSAGE ROUTING =================
        function safeSend(dc, payload) {
            try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(payload)); }
            catch (e) { console.warn('send failed', e); }
        }

        function broadcastPayload(payload, excludePeerId = null) {
            for (const [id, peer] of peers) {
                if (id === excludePeerId) continue;
                if (peer.status === 'open') safeSend(peer.dc, payload);
            }
        }

        function relayToOthers(originPeerId, rawJsonString) {
            for (const [id, peer] of peers) {
                if (id === originPeerId) continue;
                if (peer.status === 'open' && peer.dc && peer.dc.readyState === 'open') {
                    try { peer.dc.send(rawJsonString); } catch(e) {}
                }
            }
        }

        function onPeerMessage(peerId, e) {
            const peer = peers.get(peerId);
            if (!peer) return;
            peer.lastActivityAt = Date.now();

            let p;
            try { p = JSON.parse(e.data); } catch (err) { return; }

            if (p.type === 'internal-ping') { peer.missedPings = 0; safeSend(peer.dc, { type: 'internal-pong' }); return; }
            if (p.type === 'internal-pong') { peer.missedPings = 0; return; }
            if (p.type === 'handshake-identity') {
                peer.alias = p.sender;
                document.getElementById('typing-hud-text').innerText = `${p.sender} is typing`;
                updateGlobalStatusUI();
                return;
            }
            if (p.type === 'typing-signal') {
                if (p.isTyping) typingHudSet.add(p.sender || peer.alias); else typingHudSet.delete(p.sender || peer.alias);
                renderTypingHud();
                relayToOthers(peerId, e.data);
                return;
            }
            if (p.type === 'seen-receipt') {
                const tickNode = document.getElementById(`tick-${p.id}`);
                if (tickNode) { tickNode.innerHTML = `<i class="fa-solid fa-check-double text-emerald-400"></i> Seen`; tickNode.className = "text-[9px] text-emerald-400 font-bold tracking-tight"; }
                return;
            }

            // Content-bearing message types: display locally, then forward to any other connected peers
            // so multi-peer "group chat" (star/relay topology) works without a server.
            if (p.type === 'system') {
                renderSystemNotice(p.text);
                commitLogsToStorage(`[${p.time}] (${p.id}) [SYS]: ${p.text}`);
                relayToOthers(peerId, e.data);
                return;
            }
            if (p.type === 'text') {
                playIncomingSound();
                displayMessage(p.text, 'received', p.sender, p.time, p.id, peerId);
                commitLogsToStorage(`[${p.time}] (${p.id}) ${p.sender}: ${p.text}`);
                afterIncomingContent(p.id, peer);
                relayToOthers(peerId, e.data);
                return;
            }
            if (p.type === 'file-meta') {
                fileReceiveBuffers.set(p.fileId, { fileName: p.fileName, fileType: p.fileType, totalChunks: p.totalChunks, parts: new Array(p.totalChunks), sender: p.sender, time: p.time, id: p.id, receivedCount: 0 });
                renderIncomingFileProgress(p.fileId, p.fileName, p.sender, p.time, p.id, peerId);
                relayToOthers(peerId, e.data);
                return;
            }
            if (p.type === 'file-chunk') {
                const buf = fileReceiveBuffers.get(p.fileId);
                if (buf) {
                    buf.parts[p.index] = p.data;
                    buf.receivedCount++;
                    updateIncomingFileProgress(p.fileId, Math.round((buf.receivedCount / buf.totalChunks) * 100));
                }
                relayToOthers(peerId, e.data);
                return;
            }
            if (p.type === 'file-end') {
                const buf = fileReceiveBuffers.get(p.fileId);
                if (buf) {
                    playIncomingSound();
                    const dataUrl = buf.parts.join('');
                    finalizeIncomingFile(p.fileId, dataUrl, buf.fileName, buf.sender, buf.time, buf.id);
                    const storable = dataUrl.length <= MAX_PERSISTED_FILE_CHARS ? dataUrl : '[FILE_TOO_LARGE_TO_PERSIST]';
                    commitLogsToStorage(`[${buf.time}] (${buf.id}) ${buf.sender}: [FILE: ${storable} | ${buf.fileName}]`);
                    fileReceiveBuffers.delete(p.fileId);
                    afterIncomingContent(buf.id, peer);
                }
                relayToOthers(peerId, e.data);
                return;
            }
        }

        function afterIncomingContent(msgId, peer) {
            if (!isUserScrolledUp) {
                safeSend(peer.dc, { type: 'seen-receipt', id: msgId });
            } else {
                const bubble = document.getElementById(`msg-wrapper-${msgId}`);
                if (bubble) { bubble.classList.add('unread-receipt-marker'); bubble.setAttribute('data-origin-peer', findPeerIdByRecord(peer)); }
            }
            if (isUserScrolledUp) document.getElementById('unread-badge').classList.remove('hidden'); else snapToBottom();
        }
        function findPeerIdByRecord(rec) { for (const [id, p] of peers) if (p === rec) return id; return null; }

        function renderTypingHud() {
            const hud = document.getElementById('typing-hud');
            if (typingHudSet.size === 0) { hud.classList.replace('flex', 'hidden'); return; }
            document.getElementById('typing-hud-text').innerText = [...typingHudSet].join(', ') + (typingHudSet.size > 1 ? ' are typing' : ' is typing');
            hud.classList.replace('hidden', 'flex');
        }

        // ================= SENDING: TEXT =================
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if (!txt || connectedPeerCount() === 0) return;

            const name = myAlias(); const stamp = timeStamp(); const msgId = genId();
            playOutgoingSound();
            broadcastPayload({ type: 'text', text: txt, sender: name, time: stamp, id: msgId });
            displayMessage(txt, 'sent', name, stamp, msgId);
            commitLogsToStorage(`[${stamp}] (${msgId}) ${name}: ${txt}`);

            broadcastPayload({ type: 'typing-signal', isTyping: false, sender: name });
            input.value = ''; snapToBottom();
        }

        let typingTimeoutReference = null;
        function broadcastTypingSignal() {
            if (connectedPeerCount() === 0) return;
            broadcastPayload({ type: 'typing-signal', isTyping: true, sender: myAlias() });
            clearTimeout(typingTimeoutReference);
            typingTimeoutReference = setTimeout(() => { broadcastPayload({ type: 'typing-signal', isTyping: false, sender: myAlias() }); }, 1500);
        }

        // ================= SENDING: FILES (chunked + backpressure-aware, no more disconnects on big files) =================
        function triggerFileSelect() { document.getElementById('file-uploader').click(); }
        function handleFileInputChange() {
            const f = document.getElementById('file-uploader').files[0];
            if (f) sendFileToAll(f);
            document.getElementById('file-uploader').value = '';
        }
        function handleFileDrop(ev) {
            ev.preventDefault();
            document.getElementById('chat-box').classList.remove('drag-active');
            if (connectedPeerCount() === 0) return toast("Connect to someone first.", true);
            const f = ev.dataTransfer.files[0];
            if (f) sendFileToAll(f);
        }

        function waitForBufferedAmountLow(dc) {
            return new Promise(resolve => {
                if (!dc || dc.readyState !== 'open') return resolve();
                if (dc.bufferedAmount <= dc.bufferedAmountLowThreshold) return resolve();
                const handler = () => { dc.removeEventListener('bufferedamountlow', handler); resolve(); };
                dc.addEventListener('bufferedamountlow', handler);
                setTimeout(() => { dc.removeEventListener('bufferedamountlow', handler); resolve(); }, 8000); // safety timeout
            });
        }

        async function sendChunkToPeer(peerId, payload) {
            const peer = peers.get(peerId);
            if (!peer || peer.status !== 'open') return;
            await waitForBufferedAmountLow(peer.dc);
            safeSend(peer.dc, payload);
            peer.lastActivityAt = Date.now();
        }

        async function sendFileToAll(file) {
            if (connectedPeerCount() === 0) return toast("Connect to someone first.", true);
            if (file.size > MAX_FILE_SIZE) return toast(`Max file size is ${Math.round(MAX_FILE_SIZE/1024/1024)}MB.`, true);

            const fileId = 'f' + Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
            const name = myAlias(); const stamp = timeStamp(); const msgId = genId();

            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                const totalChunks = Math.ceil(dataUrl.length / CHUNK_SIZE);
                const targetIds = [...peers.entries()].filter(([id, pr]) => pr.status === 'open').map(([id]) => id);
                if (targetIds.length === 0) return toast("No connected peers to send to.", true);

                playOutgoingSound();
                renderOutgoingFileProgress(fileId, file.name, msgId, stamp);

                const metaPayload = { type: 'file-meta', fileId, fileName: file.name, fileType: file.type, totalChunks, sender: name, time: stamp, id: msgId };
                targetIds.forEach(id => { const peer = peers.get(id); if (peer) safeSend(peer.dc, metaPayload); });

                for (let i = 0; i < totalChunks; i++) {
                    const chunk = dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                    const chunkPayload = { type: 'file-chunk', fileId, index: i, data: chunk };
                    await Promise.all(targetIds.map(id => sendChunkToPeer(id, chunkPayload)));
                    updateOutgoingFileProgress(fileId, Math.round(((i + 1) / totalChunks) * 100));
                }
                targetIds.forEach(id => { const peer = peers.get(id); if (peer) safeSend(peer.dc, { type: 'file-end', fileId }); });

                finalizeOutgoingFile(fileId, dataUrl, file.name);
                const storable = dataUrl.length <= MAX_PERSISTED_FILE_CHARS ? dataUrl : '[FILE_TOO_LARGE_TO_PERSIST]';
                commitLogsToStorage(`[${stamp}] (${msgId}) ${name}: [FILE: ${storable} | ${file.name}]`);
            };
            reader.onerror = () => toast("Couldn't read that file.", true);
            reader.readAsDataURL(file);
        }

        // ================= RENDERING =================
        function displayMessage(text, type, user, time, id, originPeerId = null) { renderDOMBubble(text, type, user, time, false, null, null, id, false, false, originPeerId); }
        function displayFileBubble(data, name, type, user, time, id, originPeerId = null) { renderDOMBubble(null, type, user, time, true, data, name, id, false, false, originPeerId); }

        function renderSystemNotice(text) {
            if (document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = "w-full text-center my-1 text-[10px] font-bold text-gray-500 bg-gray-800/20 border border-gray-800/40 py-1.5 rounded-xl px-4 shrink-0 msg-enter";
            div.innerHTML = `<i class="fa-solid fa-circle-info mr-1"></i> ${text}`;
            box.appendChild(div);
            if (!isUserScrolledUp) snapToBottom();
        }

        function renderDOMBubble(text, type, user, time, isFile = false, fileData = null, fileName = null, id = null, isRehydrated = false, isSystem = false, originPeerId = null) {
            if (isSystem) return renderSystemNotice(text);
            if (document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.id = `msg-wrapper-${id}`; div.setAttribute('data-msg-id', id);
            if (originPeerId) div.setAttribute('data-origin-peer', originPeerId);
            div.className = `flex flex-col w-full max-w-[85%] gap-0.5 shrink-0 msg-enter ${type === 'sent' ? 'self-end items-end' : 'self-start items-start'}`;

            const activeColor = primaryColorMap[currentThemeColor];
            const pal = hashPalette(user || 'Peer');
            let bubbleStyle = (type === 'sent') ? `sent-bubble-node ${activeColor.msg}` : `bg-bubblePeer text-gray-100 rounded-2xl rounded-tl-none border border-gray-800/40`;

            let bubbleContent = "";
            if (isFile) {
                let preview = (fileData && fileData.startsWith('data:image/')) ? `<img src="${fileData}" class="max-w-full rounded-xl max-h-36 mb-1.5 object-cover shadow-sm">` : '';
                bubbleContent = `<div class="p-2 rounded-2xl shadow-md ${bubbleStyle}">${preview}<a href="${fileData}" download="${fileName}" class="inline-flex items-center gap-1 bg-black/20 hover:bg-black/40 text-white font-extrabold text-[10px] px-2.5 py-1.5 rounded-lg border border-white/5 transition break-all shadow-sm"><i class="fa-solid fa-circle-down text-cyan-400"></i> Download</a></div>`;
            } else {
                bubbleContent = `<div class="px-3.5 py-2 text-xs break-all leading-relaxed shadow-md rounded-2xl ${bubbleStyle}">${formatMessageText(text)}</div>`;
            }

            let receiptLine = "";
            if (type === 'sent') {
                receiptLine = isRehydrated
                    ? `<span class="text-[9px] text-gray-600 font-semibold" id="tick-${id}"><i class="fa-solid fa-check-double"></i> Seen</span>`
                    : `<span class="text-[9px] text-gray-600 font-semibold" id="tick-${id}"><i class="fa-solid fa-check text-gray-500"></i> Delivered</span>`;
            }

            const nameLabel = type === 'sent' ? '' : `<span class="w-4 h-4 rounded-full ${pal.bg} inline-flex items-center justify-center text-[7px] font-black text-white mr-1 align-middle">${initialsOf(user)}</span>`;
            div.innerHTML = `<span class="text-[10px] text-gray-500 font-extrabold px-1 tracking-wide flex items-center">${nameLabel}${user}</span>${bubbleContent}<div class="flex items-center gap-1.5 px-1 mt-0.5">${receiptLine}<span class="text-[9px] text-gray-600 font-medium tracking-tight">${time}</span></div>`;
            box.appendChild(div);
        }

        function renderOutgoingFileProgress(fileId, fileName, msgId, time) {
            if (document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.id = `file-wrapper-${fileId}`;
            div.className = `flex flex-col w-full max-w-[85%] gap-0.5 shrink-0 self-end items-end msg-enter`;
            const activeColor = primaryColorMap[currentThemeColor];
            div.innerHTML = `<span class="text-[10px] text-gray-500 font-extrabold px-1 tracking-wide">${myAlias()}</span>
                <div class="p-2.5 rounded-2xl shadow-md sent-bubble-node ${activeColor.msg} w-48">
                    <div class="text-[10px] font-bold mb-1.5 truncate flex items-center gap-1.5"><i class="fa-solid fa-paperclip"></i> ${fileName}</div>
                    <div class="progress-track"><div class="progress-fill bg-white/80" id="file-progress-${fileId}" style="width:0%"></div></div>
                    <div class="text-[9px] opacity-80 mt-1" id="file-progress-label-${fileId}">Sending… 0%</div>
                </div>
                <div class="flex items-center gap-1.5 px-1 mt-0.5"><span class="text-[9px] text-gray-600 font-medium tracking-tight">${time}</span></div>`;
            box.appendChild(div); snapToBottom();
        }
        function renderIncomingFileProgress(fileId, fileName, sender, time, msgId, originPeerId) {
            if (document.getElementById('placeholder-text')) document.getElementById('placeholder-text').remove();
            const box = document.getElementById('chat-box'); const div = document.createElement('div');
            div.id = `file-wrapper-${fileId}`;
            const pal = hashPalette(sender || 'Peer');
            div.className = `flex flex-col w-full max-w-[85%] gap-0.5 shrink-0 self-start items-start msg-enter`;
            div.innerHTML = `<span class="text-[10px] text-gray-500 font-extrabold px-1 tracking-wide"><span class="w-4 h-4 rounded-full ${pal.bg} inline-flex items-center justify-center text-[7px] font-black text-white mr-1 align-middle">${initialsOf(sender)}</span>${sender}</span>
                <div class="p-2.5 rounded-2xl shadow-md bg-bubblePeer border border-gray-800/40 w-48">
                    <div class="text-[10px] font-bold mb-1.5 truncate flex items-center gap-1.5 text-gray-200"><i class="fa-solid fa-paperclip"></i> ${fileName}</div>
                    <div class="progress-track"><div class="progress-fill bg-cyan-400" id="file-progress-${fileId}" style="width:0%"></div></div>
                    <div class="text-[9px] text-gray-400 mt-1" id="file-progress-label-${fileId}">Receiving… 0%</div>
                </div>
                <div class="flex items-center gap-1.5 px-1 mt-0.5"><span class="text-[9px] text-gray-600 font-medium tracking-tight">${time}</span></div>`;
            box.appendChild(div); if (!isUserScrolledUp) snapToBottom();
        }
        function updateOutgoingFileProgress(fileId, pct) {
            const fill = document.getElementById(`file-progress-${fileId}`); const label = document.getElementById(`file-progress-label-${fileId}`);
            if (fill) fill.style.width = pct + '%'; if (label) label.innerText = `Sending… ${pct}%`;
        }
        function updateIncomingFileProgress(fileId, pct) {
            const fill = document.getElementById(`file-progress-${fileId}`); const label = document.getElementById(`file-progress-label-${fileId}`);
            if (fill) fill.style.width = pct + '%'; if (label) label.innerText = `Receiving… ${pct}%`;
        }
        function finalizeOutgoingFile(fileId, dataUrl, fileName) {
            const wrapper = document.getElementById(`file-wrapper-${fileId}`);
            if (wrapper) wrapper.remove();
            displayFileBubble(dataUrl, fileName, 'sent', myAlias(), timeStamp(), fileId);
            snapToBottom();
        }
        function finalizeIncomingFile(fileId, dataUrl, fileName, sender, time, msgId) {
            const wrapper = document.getElementById(`file-wrapper-${fileId}`);
            if (wrapper) wrapper.remove();
            displayFileBubble(dataUrl, fileName, 'received', sender, time, msgId);
        }

        // ================= PERSISTENCE / LOGS =================
        function commitLogsToStorage(logString) {
            internalLogMemory.push(logString);
            try { localStorage.setItem('xhin_persist_logs', JSON.stringify(internalLogMemory)); }
            catch (e) { toast("Local history is full — older items may not be saved.", true); }
        }

        function parseHistoryString(str) {
            const match = str.match(/^\[(.*?)\] \((.*?)\) (.*?): ([\s\S]*)$/);
            if (!match) return null;
            const time = match[1]; const msgId = match[2]; const user = match[3]; const content = match[4];

            if (user === '[SYS]') return { time, msgId, user, type: 'system', isFile: false, isSystem: true, text: content };

            const currentAlias = myAlias();
            const type = (user === currentAlias) ? 'sent' : 'received';

            if (content.startsWith('[FILE:')) {
                const fileMatch = content.match(/^\[FILE: ([\s\S]*?) \| (.*?)\]$/);
                if (fileMatch) return { time, msgId, user, type, isFile: true, fileData: fileMatch[1] === '[FILE_TOO_LARGE_TO_PERSIST]' ? '' : fileMatch[1], fileName: fileMatch[2] };
            }
            return { time, msgId, user, type, isFile: false, text: content };
        }

        // ================= RESET =================
        function confirmFullReset() {
            if (connectedPeerCount() > 0) {
                if (!confirm("This will disconnect everyone and clear your chat history. Continue?")) return;
            } else if (internalLogMemory.length > 0) {
                if (!confirm("This will clear your saved chat history. Continue?")) return;
            }
            resetTerminalState();
        }

        function resetTerminalState() {
            for (const [id, peer] of [...peers.entries()]) {
                clearInterval(peer.heartbeatTimer);
                try { if (peer.dc) peer.dc.close(); } catch(e) {}
                try { if (peer.pc) peer.pc.close(); } catch(e) {}
            }
            peers.clear(); pendingPeerId = null; peerCounter = 0;
            typingHudSet.clear(); fileReceiveBuffers.clear();

            localStorage.removeItem('xhin_persist_logs');
            internalLogMemory = [];

            document.getElementById('typing-hud').classList.replace('flex', 'hidden');
            document.getElementById('peer-strip').classList.add('hidden'); document.getElementById('peer-strip').innerHTML = '';

            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('selection-row').classList.remove('hidden');
            document.getElementById('host-flow').classList.add('hidden');
            document.getElementById('joiner-flow').classList.add('hidden');
            document.getElementById('joiner-response-box').classList.add('hidden');
            document.getElementById('utility-bar').classList.add('hidden');

            document.getElementById('host-connect-btn').disabled = false; document.getElementById('joiner-generate-btn').disabled = false;
            document.getElementById('generated-token').value = ""; document.getElementById('friend-response-token').value = "";
            document.getElementById('host-token-input').value = ""; document.getElementById('generated-response-token').value = "";

            document.getElementById('chat-box').innerHTML = `
                <div class="text-center text-xs text-gray-600 my-auto p-6" id="placeholder-text">
                    <i class="fa-solid fa-shield-halved text-3xl block mb-2 opacity-20"></i>
                    Disconnected. Exchange manual codes above to open chat.
                </div>`;

            updateGlobalStatusUI();
            toast("Reset complete.");
        }

        // ================= LOG EXPORT / DECRYPT VIEWER =================
        function exportEncryptedLog() {
            if (internalLogMemory.length === 0) return toast("No logs recorded!", true);
            const encryptedString = CryptoJS.AES.encrypt(internalLogMemory.join('\n'), FIXED_INTERNAL_KEY).toString();
            const element = document.createElement('a');
            element.href = URL.createObjectURL(new Blob([encryptedString], { type: 'text/plain' }));
            element.download = `xhinchat_history_${new Date().toISOString().slice(0, 10)}.enc`;
            document.body.appendChild(element); element.click(); document.body.removeChild(element);
            toast("Encrypted log exported.");
        }

        function decryptUploadedLog() {
            const fileInput = document.getElementById('get-file-log').files[0];
            const outputBox = document.getElementById('decrypted-output'); if (!fileInput) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const originalText = CryptoJS.AES.decrypt(e.target.result, FIXED_INTERNAL_KEY).toString(CryptoJS.enc.Utf8);
                    if (!originalText) throw new Error();
                    outputBox.value = originalText.replace(/\(msg-.*?\)/g, '').replace(/\[FILE:[\s\S]*?\|(.*?)\]/g, '[Shared File: $1]');
                    outputBox.classList.remove('hidden');
                } catch (err) { toast("Invalid log backup file!", true); outputBox.classList.add('hidden'); }
            };
            reader.readAsText(fileInput);
        }

        function copyToken(id) {
            const textarea = document.getElementById(id); textarea.focus(); textarea.setSelectionRange(0, 99999);
            try {
                navigator.clipboard.writeText(textarea.value).then(() => toast("Token copied!")).catch(() => {
                    document.execCommand('copy'); toast("Token copied!");
                });
            } catch (err) { document.execCommand('copy'); toast("Token copied!"); }
        }

        // ================= QR: SHOW & SCAN (same-room "tap to connect"; text token still covers long-distance) =================
        let qrScanStream = null;
        let qrScanRafId = null;
        let qrScanTargetInputId = null;
        let qrScanOnSuccess = null;

        function showTokenQr(sourceTextareaId) {
            const value = document.getElementById(sourceTextareaId).value.trim();
            if (!value) return toast("Nothing to show yet — wait for the token to finish compiling.", true);

            const wrap = document.getElementById('qr-canvas-target');
            wrap.innerHTML = '';
            try {
                new QRCode(wrap, { text: value, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
            } catch (e) {
                return toast("This token is too long to fit in a QR code — send it as text instead.", true);
            }

            document.getElementById('qr-modal-title').innerHTML = `<i class="fa-solid fa-qrcode text-cyan-400"></i> Let them scan this`;
            document.getElementById('qr-modal-hint').innerText = "Hold this up to their camera. If they're not in the same room, use the text token / copy button instead.";
            document.getElementById('qr-display-wrap').classList.remove('hidden');
            document.getElementById('qr-scan-wrap').classList.add('hidden');
            document.getElementById('qr-modal').classList.remove('hidden');
        }

        async function openQrScanner(targetInputId, onSuccessCallback) {
            qrScanTargetInputId = targetInputId;
            qrScanOnSuccess = onSuccessCallback;

            document.getElementById('qr-modal-title').innerHTML = `<i class="fa-solid fa-camera text-cyan-400"></i> Scan their code`;
            document.getElementById('qr-modal-hint').innerText = "Point your camera at their QR code. Only works when you're both physically together.";
            document.getElementById('qr-display-wrap').classList.add('hidden');
            document.getElementById('qr-scan-wrap').classList.remove('hidden');
            document.getElementById('qr-modal').classList.remove('hidden');

            try {
                qrScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            } catch (e) {
                toast("Camera access denied or unavailable — paste the text token instead.", true);
                closeQrModal();
                return;
            }
            const video = document.getElementById('qr-video');
            video.srcObject = qrScanStream;
            await video.play().catch(() => {});
            scanLoop();
        }

        function scanLoop() {
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-scan-canvas');
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
                qrScanRafId = requestAnimationFrame(scanLoop);
                return;
            }
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const result = (typeof jsQR === 'function') ? jsQR(imageData.data, imageData.width, imageData.height) : null;

            if (result && result.data) {
                const target = document.getElementById(qrScanTargetInputId);
                if (target) target.value = result.data;
                toast("QR code scanned!");
                const cb = qrScanOnSuccess;
                closeQrModal();
                if (typeof cb === 'function') cb();
                return;
            }
            qrScanRafId = requestAnimationFrame(scanLoop);
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
            if (qrScanRafId) { cancelAnimationFrame(qrScanRafId); qrScanRafId = null; }
            if (qrScanStream) { qrScanStream.getTracks().forEach(t => t.stop()); qrScanStream = null; }
            const video = document.getElementById('qr-video');
            if (video) video.srcObject = null;
            qrScanTargetInputId = null; qrScanOnSuccess = null;
        }
    </script>
</body>
</html>
